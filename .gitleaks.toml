title = "SHVYA AI Gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Historical database.md prose describing token storage; not a credential."
condition = "AND"
commits = ["ce958008ad56b2f74039d7e5357f7633715db270"]
paths = ['''^database\.md$''']
regexTarget = "line"
regexes = ['''Diagnostic/Operations OAuth authorization codes, access tokens and refresh tokens''']

[[rules.allowlists]]
description = "Historical Vault model table describing section states; not a credential."
condition = "AND"
commits = ["6716efac6116babaa8a3aa4be99b75472a8ae344"]
paths = ['''^docs/shvya-vault\.md$''']
regexTarget = "line"
regexes = ['''Stable section key, empty/filled/unavailable state, completion flag''']

[[rules.allowlists]]
description = "Public localStorage analytics consent preference name; not a credential."
condition = "AND"
paths = ['''^static/marketing/analytics\.js$''']
regexTarget = "line"
regexes = ['''^\s*const key = 'shvya-marketing-consent-v1';\s*$''']

[[rules.allowlists]]
description = "Browser test dispatches the public analytics consent preference name; not a credential."
condition = "AND"
paths = ['''^tests/js/marketing-analytics\.test\.cjs$''']
regexTarget = "line"
regexes = ['''^\s*const h=harness\(\{consent:'granted'\}\);h\.events\.storage\(\{key:'shvya-marketing-consent-v1',newValue:'denied'\}\);\s*$''']
