server {
    listen 80;
    server_name staging.shvya-ai.com;

    client_max_body_size 20M;

    auth_basic "SHVYA AI Staging";
    auth_basic_user_file /etc/nginx/staging.htpasswd;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Deployment probes stay machine-readable without exposing application data.
    location /health/ {
        auth_basic off;
        proxy_pass http://web:8000;
        proxy_set_header Host staging.shvya-ai.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location /ws/ {
        proxy_pass http://ws:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host staging.shvya-ai.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host staging.shvya-ai.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
