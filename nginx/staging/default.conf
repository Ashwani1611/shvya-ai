server {
    listen 80;
    server_name staging.shvya-ai.com;

    client_max_body_size 20M;

    auth_basic "SHVYA AI Staging";
    auth_basic_user_file /etc/nginx/staging.htpasswd;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # MCP/OAuth protocol endpoints must be reachable by external MCP clients.
    # They bypass only the outer staging Basic Auth layer; SHVYA OAuth/PKCE,
    # actor authentication, tenant isolation and capability checks remain
    # authoritative inside Django.
    location = /operations/mcp/ {
        auth_basic off;
        proxy_pass http://web:8000;
        proxy_set_header Host staging.shvya-ai.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /operations/oauth/register {
        auth_basic off;
        proxy_pass http://web:8000;
        proxy_set_header Host staging.shvya-ai.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /operations/oauth/authorize {
        auth_basic off;
        proxy_pass http://web:8000;
        proxy_set_header Host staging.shvya-ai.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /operations/oauth/token {
        auth_basic off;
        proxy_pass http://web:8000;
        proxy_set_header Host staging.shvya-ai.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /operations/oauth/revoke {
        auth_basic off;
        proxy_pass http://web:8000;
        proxy_set_header Host staging.shvya-ai.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /operations/.well-known/oauth-protected-resource {
        auth_basic off;
        proxy_pass http://web:8000;
        proxy_set_header Host staging.shvya-ai.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /operations/.well-known/oauth-authorization-server {
        auth_basic off;
        proxy_pass http://web:8000;
        proxy_set_header Host staging.shvya-ai.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /.well-known/oauth-authorization-server/operations {
        auth_basic off;
        proxy_pass http://web:8000;
        proxy_set_header Host staging.shvya-ai.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Deployment probes stay machine-readable without exposing application data.
    location /health/ {
        auth_basic off;
        proxy_pass http://web:8000;
        proxy_set_header Host staging.shvya-ai.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location /ws/ {
        proxy_pass http://ws:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host staging.shvya-ai.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host staging.shvya-ai.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
