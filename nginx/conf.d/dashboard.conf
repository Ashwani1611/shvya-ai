server {
    listen 80;
    server_name shvya-ai.com www.shvya-ai.com dashboard.shvya-ai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://shvya-ai.com$request_uri;
    }
}

# Legacy hostnames remain valid at TLS level, then redirect to the canonical
# apex domain. The existing dashboard certificate is intentionally reused and
# must be expanded before cutover to include all three SANs:
# shvya-ai.com, www.shvya-ai.com, dashboard.shvya-ai.com.
server {
    listen 443 ssl;
    server_name www.shvya-ai.com dashboard.shvya-ai.com;

    ssl_certificate /etc/letsencrypt/live/dashboard.shvya-ai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.shvya-ai.com/privkey.pem;

    return 301 https://shvya-ai.com$request_uri;
}

server {
    listen 443 ssl;
    server_name shvya-ai.com;

    # Runtime Docker DNS lookup allows web/ASGI replica membership to change
    # without baking a single container IP into Nginx at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django_web http://web:8000;
    set $django_ws http://ws:8001;

    ssl_certificate /etc/letsencrypt/live/dashboard.shvya-ai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.shvya-ai.com/privkey.pem;

    client_max_body_size 20M;

    # Large Operations MCP requests are authenticated in Django before
    # tool execution. 80 MiB safely carries a 50 MiB binary after base64
    # expansion while ordinary application routes retain the 20 MiB cap.
    location = /operations/mcp/ {
        client_max_body_size 80M;
        proxy_pass $django_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    # WebSocket connections (live WhatsApp chat updates) are routed to the
    # separate ASGI container and kept alive for long-running conversations.
    location /ws/ {
        proxy_pass $django_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass $django_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
