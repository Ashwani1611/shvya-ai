server {
    listen 80;
    server_name dashboard.shvya-ai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dashboard.shvya-ai.com;

    # Runtime Docker DNS lookup allows web/ASGI replica membership to change
    # without baking a single container IP into Nginx at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django_web http://web:8000;
    set $django_ws http://ws:8001;

    ssl_certificate /etc/letsencrypt/live/dashboard.shvya-ai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.shvya-ai.com/privkey.pem;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    # WebSocket connections (live WhatsApp chat updates) -- routed
    # to the separate `ws` (daphne/ASGI) container, not `web`
    # (gunicorn/WSGI can't serve WebSocket upgrades at all).
    #
    # proxy_read_timeout is raised from nginx's 60s default because
    # a WebSocket connection is meant to stay open for the whole
    # chat session, not one request/response cycle -- otherwise
    # nginx kills the connection out from under an idle chat.
    location /ws/ {
        proxy_pass $django_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass $django_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
