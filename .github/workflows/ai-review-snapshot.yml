name: AI review source snapshot

on:
  push:
    branches: [fix/ai-phases-1-11-validated]
    paths: [.github/workflows/ai-review-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Package tracked source and pinned test dependencies
        run: |
          git archive --format=zip --output=review-source.zip HEAD
          python -m pip download -r requirements-dev.txt --dest wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: ai-review-kit
          path: |
            review-source.zip
            wheelhouse/
          retention-days: 1
          if-no-files-found: error
