name: Assemble reviewed Workflows fixes
on:
  push:
    branches: [fix/workflows-runtime-source-editor]
    paths: [.workflows-assemble.py, .github/workflows/workflows-audit-export.yml]
permissions:
  contents: write
concurrency:
  group: workflows-branch-assembly
  cancel-in-progress: false
jobs:
  assemble:
    if: github.ref == 'refs/heads/fix/workflows-runtime-source-editor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Apply exact reviewed edits to the feature branch only
        run: |
          set -eu
          python - <<'PY'
          from pathlib import Path
          p = Path('.workflows-assemble.py')
          text = p.read_text()
          text = text.replace('    if text.count(old) != count:', '    expected = 2 if path == "apps/channels/tasks.py" and old == "            message.status = _WHATSAPP_SENDING_STATUS\\n" else count\n    if text.count(old) != expected:')
          text = text.replace('text.replace(old, new)', 'text.replace(old, new, count)')
          p.write_text(text)
          PY
          python .workflows-assemble.py
          node --check static/triggers/dashboard.js
          python -m compileall -q services/triggers apps/triggers apps/channels/tasks.py
          rm .workflows-assemble.py .github/workflows/workflows-audit-export.yml
          git add -u
          git add apps/triggers/tests/test_workflows_runtime_contract.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete Workflows source conditions, editor fixes and backend regression contracts'
          git push origin HEAD:refs/heads/fix/workflows-runtime-source-editor
          mkdir -p /tmp/workflows-reviewed-source
          git archive HEAD | tar -x -C /tmp/workflows-reviewed-source
          git rev-parse HEAD > /tmp/workflows-reviewed-source/REVIEW_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: workflows-reviewed-source
          path: /tmp/workflows-reviewed-source/
          include-hidden-files: true
          retention-days: 1
