name: Hosted WhatsApp audit snapshot

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/hosted-audit-snapshot.yml']

permissions:
  contents: read

jobs:
  source:
    if: github.head_ref == 'fix/hosted-whatsapp-chat-reliability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive tracked source for isolated audit and regression tests
        run: git archive --format=zip --output=hosted-audit-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: hosted-audit-source
          path: hosted-audit-source.zip
          retention-days: 1
          if-no-files-found: error
