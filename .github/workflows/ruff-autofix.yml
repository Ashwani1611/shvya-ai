name: Ruff Autofix

on:
  push:
    branches: [ci/enforce-full-ruff]

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ci/enforce-full-ruff

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pinned Ruff
        run: pip install ruff==0.16.4

      - name: Apply safe Ruff fixes
        run: ruff check . --fix --exit-zero

      - name: Commit safe fixes
        run: |
          if git diff --quiet; then
            echo "No safe Ruff fixes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Apply safe Ruff fixes"
          git push origin HEAD:ci/enforce-full-ruff
