name: Deploy Staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy staging to isolated Docker stack
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy staging over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -eu

            APP_DIR=/opt/shvya-ai-staging
            PROD_DIR=/opt/shvya-ai
            COMPOSE="docker compose -p shvya-staging --env-file .env.staging -f docker-compose.staging.yml"

            echo "Preparing isolated staging checkout..."
            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              git clone --branch staging --single-branch https://github.com/Ashwani1611/shvya-ai.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin staging
            git checkout staging
            git reset --hard origin/staging

            ensure_env_secret() {
              key="$1"
              current="$(sed -n "s/^${key}=//p" .env.staging | tail -n 1 | tr -d '\r')"
              case "$current" in
                ""|change-me-*) ;;
                *) return ;;
              esac
              value="$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')"
              if grep -q "^${key}=" .env.staging; then
                sed -i "s|^${key}=.*$|${key}=${value}|" .env.staging
              else
                printf '\n%s=%s\n' "$key" "$value" >> .env.staging
              fi
              unset value
              echo "Generated staging ${key}."
            }

            if [ ! -f .env.staging ]; then
              cp .env.staging.example .env.staging
              echo "Created .env.staging from the safe staging template."
            fi

            ensure_env_secret SECRET_KEY
            ensure_env_secret DB_PASSWORD
            ensure_env_secret META_VERIFY_TOKEN
            ensure_env_secret WHATSAPP_WEB_GATEWAY_TOKEN
            ensure_env_secret WHATSAPP_WEB_CALLBACK_TOKEN
            ensure_env_secret STAGING_BASIC_AUTH_PASSWORD
            chmod 600 .env.staging

            STAGING_BASIC_AUTH_USER="$(sed -n 's/^STAGING_BASIC_AUTH_USER=//p' .env.staging | tail -n 1 | tr -d '\r')"
            STAGING_BASIC_AUTH_PASSWORD="$(sed -n 's/^STAGING_BASIC_AUTH_PASSWORD=//p' .env.staging | tail -n 1 | tr -d '\r')"
            if [ -z "$STAGING_BASIC_AUTH_USER" ] || [ -z "$STAGING_BASIC_AUTH_PASSWORD" ]; then
              echo "Staging Basic Auth credentials are missing."
              exit 1
            fi
            if ! command -v openssl >/dev/null 2>&1; then
              echo "openssl is required on the VPS to generate the staging Basic Auth file."
              exit 1
            fi
            STAGING_BASIC_AUTH_HASH="$(openssl passwd -apr1 "$STAGING_BASIC_AUTH_PASSWORD")"
            printf '%s:%s\n' "$STAGING_BASIC_AUTH_USER" "$STAGING_BASIC_AUTH_HASH" > .staging.htpasswd
            chmod 644 .staging.htpasswd
            unset STAGING_BASIC_AUTH_PASSWORD STAGING_BASIC_AUTH_HASH

            mkdir -p "$APP_DIR/staticfiles" "$APP_DIR/media" "$APP_DIR/backups"

            echo "Validating staging Compose configuration..."
            $COMPOSE config --quiet

            echo "Building staging application containers..."
            $COMPOSE build web ws worker ai_realtime_worker hosted_ai_worker beat whatsapp-web-gateway

            echo "Preparing writable staging bind mounts for the non-root runtime user..."
            $COMPOSE run --rm --no-deps --user 0 web sh -c \
              'mkdir -p /app/staticfiles /app/media && chown -R 10001:10001 /app/staticfiles /app/media'

            echo "Starting isolated staging PostgreSQL and Redis..."
            $COMPOSE up -d --wait db redis

            echo "Applying staging migrations..."
            $COMPOSE run --rm web python manage.py migrate --noinput

            echo "Collecting staging static assets..."
            $COMPOSE run --rm web python manage.py collectstatic --noinput

            echo "Starting staging application services..."
            $COMPOSE up -d --no-deps web ws worker ai_realtime_worker hosted_ai_worker beat
            $COMPOSE up -d --wait --no-deps web

            echo "Verifying staging Python application services run as the non-root app user..."
            for service in web ws worker ai_realtime_worker hosted_ai_worker beat; do
              uid="$($COMPOSE exec -T "$service" id -u)"
              gid="$($COMPOSE exec -T "$service" id -g)"
              if [ "$uid" != "10001" ] || [ "$gid" != "10001" ]; then
                echo "${service} is running as unexpected uid:gid ${uid}:${gid}."
                $COMPOSE ps
                exit 1
              fi
            done

            $COMPOSE up -d --wait --no-deps --force-recreate whatsapp-web-gateway
            # web/ws are recreated above and may receive new Docker IPs. Recreate
            # staging Nginx so its startup-time DNS resolution cannot retain stale
            # upstream addresses from the previous containers.
            $COMPOSE up -d --wait --force-recreate nginx

            echo "Checking staging dependency readiness through its private Nginx..."
            ready=0
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --max-time 5 \
                -H "Host: staging.shvya-ai.com" \
                http://127.0.0.1:8180/health/ready/ >/dev/null; then
                ready=1
                break
              fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo "Staging readiness check failed."
              $COMPOSE ps
              $COMPOSE logs --tail=150 nginx web worker ai_realtime_worker hosted_ai_worker
              exit 1
            fi

            echo "Connecting the existing production Nginx edge to the staging network..."
            if [ ! -d "$PROD_DIR" ]; then
              echo "Production directory $PROD_DIR is missing."
              exit 1
            fi

            EDGE_COMPOSE="docker compose -f $PROD_DIR/docker-compose.yml"
            EDGE_NGINX_ID="$($EDGE_COMPOSE ps -q nginx)"
            STAGING_NETWORK="shvya-staging_default"

            if [ -z "$EDGE_NGINX_ID" ]; then
              echo "Production Nginx container is not running."
              exit 1
            fi

            if ! docker network inspect "$STAGING_NETWORK" >/dev/null 2>&1; then
              echo "Staging Docker network $STAGING_NETWORK does not exist."
              exit 1
            fi

            if ! docker inspect "$EDGE_NGINX_ID" --format '{{json .NetworkSettings.Networks}}' | grep -q 'shvya-staging_default'; then
              docker network connect "$STAGING_NETWORK" "$EDGE_NGINX_ID"
            fi

            # Before TLS exists, expose only the ACME challenge. Never send Basic
            # Auth credentials or application traffic over plain HTTP.
            cat > "$PROD_DIR/nginx/conf.d/staging.conf" <<'NGINX_HTTP'
            server {
                listen 80;
                server_name staging.shvya-ai.com;

                add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

                location /.well-known/acme-challenge/ {
                    root /var/www/certbot;
                }

                location / {
                    return 503;
                }
            }
            NGINX_HTTP

            $EDGE_COMPOSE exec -T nginx nginx -t
            $EDGE_COMPOSE exec -T nginx nginx -s reload

            CERT_DIR="$PROD_DIR/nginx/certbot/conf/live/staging.shvya-ai.com"
            if [ ! -f "$CERT_DIR/fullchain.pem" ]; then
              echo "Attempting Let's Encrypt certificate bootstrap for staging.shvya-ai.com..."
              if $EDGE_COMPOSE run --rm --entrypoint certbot certbot \
                certonly --webroot -w /var/www/certbot \
                -d staging.shvya-ai.com \
                --agree-tos --non-interactive --register-unsafely-without-email; then
                echo "Staging TLS certificate issued."
              else
                echo "TLS bootstrap could not complete."
                echo "The staging stack is healthy locally. Point staging.shvya-ai.com at this VPS, then rerun Deploy Staging."
              fi
            fi

            if [ -f "$CERT_DIR/fullchain.pem" ]; then
              cat > "$PROD_DIR/nginx/conf.d/staging.conf" <<'NGINX_HTTPS'
            server {
                listen 80;
                server_name staging.shvya-ai.com;

                location /.well-known/acme-challenge/ {
                    root /var/www/certbot;
                }

                location / {
                    return 301 https://$host$request_uri;
                }
            }

            server {
                listen 443 ssl;
                server_name staging.shvya-ai.com;

                ssl_certificate /etc/letsencrypt/live/staging.shvya-ai.com/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/staging.shvya-ai.com/privkey.pem;

                resolver 127.0.0.11 valid=30s ipv6=off;
                set $staging_proxy http://shvya-staging-nginx:80;

                client_max_body_size 20M;

                location /ws/ {
                    proxy_pass $staging_proxy;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto https;
                    proxy_read_timeout 3600s;
                }

                location / {
                    proxy_pass $staging_proxy;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto https;
                }
            }
            NGINX_HTTPS

              $EDGE_COMPOSE exec -T nginx nginx -t
              $EDGE_COMPOSE exec -T nginx nginx -s reload

              cert_fp_file() {
                openssl x509 -in "$CERT_DIR/fullchain.pem" -noout -fingerprint -sha256 | cut -d= -f2
              }
              cert_fp_served() {
                echo | openssl s_client -connect 127.0.0.1:443 -servername staging.shvya-ai.com 2>/dev/null \
                  | openssl x509 -noout -fingerprint -sha256 2>/dev/null | cut -d= -f2
              }

              FILE_FP="$(cert_fp_file)"
              SERVED_FP="$(cert_fp_served)"
              if [ -z "$SERVED_FP" ] || [ "$FILE_FP" != "$SERVED_FP" ]; then
                echo "Edge Nginx is serving stale staging TLS state; restarting only the edge Nginx container."
                docker restart "$EDGE_NGINX_ID" >/dev/null
                sleep 2
                EDGE_NGINX_ID="$($EDGE_COMPOSE ps -q nginx)"
                if [ -z "$EDGE_NGINX_ID" ]; then
                  echo "Edge Nginx did not return after restart."
                  exit 1
                fi
                if ! docker inspect "$EDGE_NGINX_ID" --format '{{json .NetworkSettings.Networks}}' | grep -q "$STAGING_NETWORK"; then
                  docker network connect "$STAGING_NETWORK" "$EDGE_NGINX_ID"
                fi
                $EDGE_COMPOSE exec -T nginx nginx -t
                SERVED_FP="$(cert_fp_served)"
              fi

              if [ -z "$SERVED_FP" ] || [ "$FILE_FP" != "$SERVED_FP" ]; then
                echo "Edge Nginx still is not serving the expected staging certificate."
                exit 1
              fi

              echo "Verifying local staging HTTPS readiness through the corrected edge..."
              curl --noproxy '*' --fail --silent --show-error --max-time 10 \
                --resolve "staging.shvya-ai.com:443:127.0.0.1" \
                https://staging.shvya-ai.com/health/ready/ >/dev/null

              echo "Verifying public staging IPv4 HTTPS readiness endpoint..."
              curl --noproxy '*' -4 --fail --silent --show-error --max-time 10 \
                https://staging.shvya-ai.com/health/ready/ >/dev/null
            fi

            echo "Staging service status:"
            $COMPOSE ps
            docker image prune -f
