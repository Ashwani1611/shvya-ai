name: Call Intelligence Android

on:
  pull_request:
    paths:
      - "android/call-intelligence/**"
      - ".github/workflows/call-intelligence-android.yml"
  push:
    branches: [main]
    paths:
      - "android/call-intelligence/**"
      - ".github/workflows/call-intelligence-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: call-intelligence-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/call-intelligence

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Preserve internal signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shvya-call-intelligence-internal-signing-v1

      - name: Build installable release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shvya-call-intelligence
          path: android/call-intelligence/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish stable internal APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh release delete call-intelligence-latest --yes --cleanup-tag || true
          git tag -f call-intelligence-latest "$GITHUB_SHA"
          git push --force origin refs/tags/call-intelligence-latest
          cp android/call-intelligence/app/build/outputs/apk/release/app-release.apk shvya-call-intelligence.apk
          SHA256="$(sha256sum shvya-call-intelligence.apk | awk '{print $1}')"
          gh release create call-intelligence-latest shvya-call-intelligence.apk             --title "SHVYA Call Intelligence Android"             --notes "Internal Android employee build. SHA-256: $SHA256"
