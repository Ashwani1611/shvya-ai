name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production VPS
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/shvya-ai

            # Production deploys are CI-only. This SHA is the exact main
            # commit validated by the successful CI workflow_run trigger.
            DEPLOY_SHA="${{ github.event.workflow_run.head_sha }}"
            if [ -z "$DEPLOY_SHA" ]; then
              echo "Deployment SHA is missing."
              exit 1
            fi

            # This marker advances only after every production verification succeeds.
            # It lets routine deploys safely skip migration/gateway work that cannot
            # be relevant to the commits since the last known-good release.
            STATE_FILE="/opt/shvya-ai/.last-successful-production-deploy"
            LAST_SUCCESS_SHA=""
            if [ -s "$STATE_FILE" ]; then
              LAST_SUCCESS_SHA="$(tr -d '[:space:]' < "$STATE_FILE")"
            fi

            echo "Fetching production branch for deployment SHA validation..."
            git fetch --no-tags origin main

            if ! git cat-file -e "${DEPLOY_SHA}^{commit}" 2>/dev/null; then
              echo "Deployment SHA ${DEPLOY_SHA} is not available in the production repository."
              exit 1
            fi

            if ! git merge-base --is-ancestor "$DEPLOY_SHA" origin/main; then
              echo "Refusing deployment: ${DEPLOY_SHA} is not part of origin/main."
              exit 1
            fi

            MIGRATION_FILES_CHANGED=1
            GATEWAY_CHANGED=1
            if [ -n "$LAST_SUCCESS_SHA" ] \
              && git cat-file -e "${LAST_SUCCESS_SHA}^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$LAST_SUCCESS_SHA" "$DEPLOY_SHA"; then
              if git diff --quiet "$LAST_SUCCESS_SHA" "$DEPLOY_SHA" -- ':(glob)**/migrations/*.py'; then
                MIGRATION_FILES_CHANGED=0
              fi
              if git diff --quiet "$LAST_SUCCESS_SHA" "$DEPLOY_SHA" -- whatsapp_web_gateway docker-compose.yml; then
                GATEWAY_CHANGED=0
              fi
            else
              echo "No trusted previous production marker; using the full safe deployment path."
            fi

            echo "Deploying exact validated commit: ${DEPLOY_SHA}"
            git checkout main
            git reset --hard "$DEPLOY_SHA"

            ACTUAL_SHA="$(git rev-parse HEAD)"
            if [ "$ACTUAL_SHA" != "$DEPLOY_SHA" ]; then
              echo "Deployment checkout mismatch: expected ${DEPLOY_SHA}, got ${ACTUAL_SHA}."
              exit 1
            fi

            if [ ! -f .env ]; then
              echo "Production .env file is missing."
              exit 1
            fi

            ensure_env_secret() {
              key="$1"
              current="$(sed -n "s/^${key}=//p" .env | tail -n 1 | tr -d '\r')"

              case "$current" in
                ""|'""'|"''"|change-me-*) ;;
                *) return ;;
              esac

              value="$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')"

              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*$|${key}=${value}|" .env
              else
                printf '\n%s=%s\n' "$key" "$value" >> .env
              fi

              unset value
              echo "Generated missing ${key} in production .env."
            }

            echo "Ensuring production security secrets exist..."
            ensure_env_secret JWT_SECRET
            ensure_env_secret CREDENTIAL_ENCRYPTION_KEY
            ensure_env_secret WHATSAPP_WEB_GATEWAY_TOKEN
            ensure_env_secret WHATSAPP_WEB_CALLBACK_TOKEN
            chmod 600 .env

            echo "Validating Docker Compose configuration..."
            docker compose config --quiet

            echo "Building updated Python application containers..."
            docker compose build web ws worker ai_realtime_worker hosted_ai_worker beat

            if [ "$GATEWAY_CHANGED" -eq 1 ]; then
              echo "WhatsApp Web gateway changed; rebuilding its image..."
              docker compose build whatsapp-web-gateway
            else
              echo "WhatsApp Web gateway is unchanged; reusing the verified running image."
            fi

            echo "Preparing writable application bind mounts for the non-root runtime user..."
            docker compose run --rm --no-deps --user 0 web sh -c \
              'mkdir -p /app/staticfiles /app/media && chown -R 10001:10001 /app/staticfiles /app/media'

            echo "Ensuring database and Redis are healthy..."
            docker compose up -d --wait db redis

            APPLICATION_MAINTENANCE=0
            report_maintenance_failure() {
              deploy_status=$?
              if [ "$deploy_status" -ne 0 ] && [ "$APPLICATION_MAINTENANCE" -eq 1 ]; then
                echo "Deployment failed during application maintenance; application services may remain stopped."
                echo "Database, Redis, and gateway state are preserved."
                echo "Review the failed migration/startup before recovery; do not restart old images against the new schema."
                docker compose ps || true
              fi
              return "$deploy_status"
            }
            trap report_maintenance_failure EXIT

            # Schema-changing migrations still use the conservative maintenance
            # path. Routine commits with no migration-file changes keep the live
            # application running until the replacement containers are ready.
            if [ "$MIGRATION_FILES_CHANGED" -eq 1 ]; then
              APPLICATION_MAINTENANCE=1
              echo "Migration files changed; pausing HTTP/WebSocket traffic and schedulers..."
              docker compose stop --timeout 60 beat web ws
              echo "Draining application workers with a bounded graceful shutdown..."
              docker compose stop --timeout 300 worker ai_realtime_worker hosted_ai_worker
              if [ -n "$(docker compose ps --status running -q web ws worker ai_realtime_worker hosted_ai_worker beat)" ]; then
                echo "Refusing migrations while an old application service is still running."
                exit 1
              fi

              echo "Applying database migrations while old application services are stopped..."
              docker compose run --rm --no-deps web python manage.py migrate --noinput
            else
              echo "No migration files changed since the last successful production deploy; skipping migration maintenance."
            fi

            echo "Collecting static files before replacing the live web container..."
            docker compose run --rm --no-deps web python manage.py collectstatic --noinput

            echo "Updating application services..."
            docker compose up -d --no-deps web ws worker ai_realtime_worker hosted_ai_worker beat

            echo "Waiting for Django/Gunicorn dependency readiness..."
            ready=0
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 2 \
                -H "Host: dashboard.shvya-ai.com" \
                -H "X-Forwarded-Proto: https" \
                http://127.0.0.1:8000/health/ready/ >/dev/null; then
                ready=1
                echo "Django dependency readiness check passed."
                break
              fi
              echo "Waiting for Django readiness... attempt ${attempt}/30"
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "Web service did not become ready."
              docker compose ps
              docker compose logs --tail=150 web
              exit 1
            fi
            APPLICATION_MAINTENANCE=0

            echo "Verifying realtime AI workers are running..."
            if ! docker compose ps --status running ai_realtime_worker | grep -q ai_realtime_worker; then
              echo "Realtime WhatsApp API AI worker is not running."
              docker compose ps
              docker compose logs --tail=150 ai_realtime_worker
              exit 1
            fi
            if ! docker compose ps --status running hosted_ai_worker | grep -q hosted_ai_worker; then
              echo "Hosted AI worker is not running."
              docker compose ps
              docker compose logs --tail=150 hosted_ai_worker
              exit 1
            fi

            echo "Verifying Python application services run as the non-root app user..."
            for service in web ws worker ai_realtime_worker hosted_ai_worker beat; do
              uid="$(docker compose exec -T "$service" id -u)"
              gid="$(docker compose exec -T "$service" id -g)"
              if [ "$uid" != "10001" ] || [ "$gid" != "10001" ]; then
                echo "${service} is running as unexpected uid:gid ${uid}:${gid}."
                docker compose ps
                exit 1
              fi
            done

            echo "Verifying live AI task registration and queue consumers..."
            ai_ready=0
            for attempt in $(seq 1 5); do
              if docker compose exec -T web python manage.py check_ai_runtime; then
                ai_ready=1
                break
              fi
              sleep 2
            done
            if [ "$ai_ready" -ne 1 ]; then
              docker compose logs --tail=100 ai_realtime_worker hosted_ai_worker beat
              exit 1
            fi

            if [ "$GATEWAY_CHANGED" -eq 1 ]; then
              echo "Recreating WhatsApp Web gateway with the freshly built image..."
              docker compose up -d --no-deps --force-recreate whatsapp-web-gateway
            else
              echo "WhatsApp Web gateway is unchanged; keeping the existing container when possible..."
              docker compose up -d --no-deps whatsapp-web-gateway
            fi

            echo "Waiting for the WhatsApp Web gateway health endpoint..."
            gateway_healthy=0
            for attempt in $(seq 1 20); do
              if docker compose exec -T whatsapp-web-gateway node -e "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                gateway_healthy=1
                break
              fi
              echo "Waiting for WhatsApp Web gateway... attempt ${attempt}/20"
              sleep 1
            done
            if [ "$gateway_healthy" -ne 1 ]; then
              echo "WhatsApp Web gateway did not become healthy."
              docker compose ps
              docker compose logs --tail=150 whatsapp-web-gateway
              exit 1
            fi

            echo "Verifying Django can resolve and authenticate to the WhatsApp Web gateway..."
            if ! docker compose exec -T web python -c "import os, requests; base=os.getenv('WHATSAPP_WEB_GATEWAY_URL', 'http://whatsapp-web-gateway:3000').rstrip('/'); token=os.getenv('WHATSAPP_WEB_GATEWAY_TOKEN', '').strip(); callback_token=os.getenv('WHATSAPP_WEB_CALLBACK_TOKEN', '').strip(); assert token, 'WHATSAPP_WEB_GATEWAY_TOKEN is not configured'; assert callback_token, 'WHATSAPP_WEB_CALLBACK_TOKEN is not configured'; response=requests.get(base + '/sessions/__deployment_probe__', headers={'Authorization': 'Bearer ' + token}, timeout=5); assert response.status_code == 404, 'gateway probe returned HTTP ' + str(response.status_code) + ': ' + response.text[:200]"; then
              echo "Django cannot use the WhatsApp Web gateway."
              docker compose ps
              docker compose logs --tail=150 whatsapp-web-gateway web
              exit 1
            fi

            echo "Verifying the WhatsApp Web gateway can post callbacks to Django over the private network..."
            if ! docker compose exec -T whatsapp-web-gateway node -e "(async()=>{const url=String(process.env.SHVYA_HOSTED_CALLBACK_URL||'').trim();const token=String(process.env.WHATSAPP_WEB_CALLBACK_TOKEN||'').trim();if(!url)throw new Error('SHVYA_HOSTED_CALLBACK_URL is not configured');if(!token)throw new Error('WHATSAPP_WEB_CALLBACK_TOKEN is not configured');const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-SHVYA-Hosted-Token':token},body:JSON.stringify({sessionId:'00000000-0000-0000-0000-000000000000',event:'ready'})});const body=await response.text();if(response.status!==200)throw new Error('callback probe returned HTTP '+response.status+': '+body.slice(0,200));})().catch(error=>{console.error(error.message);process.exit(1)})"; then
              echo "WhatsApp Web gateway cannot post callbacks to Django."
              docker compose ps
              docker compose logs --tail=150 whatsapp-web-gateway web
              exit 1
            fi

            echo "Keeping Nginx running and ensuring edge services exist..."
            docker compose up -d --no-deps nginx certbot

            echo "Reattaching Nginx to staging network when staging exists..."
            if docker network inspect shvya-staging_default >/dev/null 2>&1; then
              NGINX_ID="$(docker compose ps -q nginx)"
              if [ -n "$NGINX_ID" ] && ! docker inspect "$NGINX_ID" --format '{{json .NetworkSettings.Networks}}' | grep -q 'shvya-staging_default'; then
                docker network connect shvya-staging_default "$NGINX_ID" || true
              fi
            fi

            echo "Testing and gracefully reloading Nginx..."
            docker compose exec -T nginx nginx -t
            docker compose exec -T nginx nginx -s reload

            echo "Verifying the public HTTPS endpoint..."
            public_ready=0
            for attempt in $(seq 1 10); do
              if curl --fail --silent --show-error --max-time 5 \
                https://dashboard.shvya-ai.com/health/ready/ >/dev/null; then
                public_ready=1
                echo "Public HTTPS readiness endpoint is healthy."
                break
              fi
              echo "Waiting for public HTTPS endpoint... attempt ${attempt}/10"
              sleep 2
            done

            if [ "$public_ready" -ne 1 ]; then
              echo "Public HTTPS endpoint failed readiness verification."
              docker compose ps
              docker compose logs --tail=100 nginx web
              exit 1
            fi

            echo "Current service status:"
            docker compose ps

            # Advance the marker only after application, gateway, Nginx and
            # public HTTPS verification have all completed successfully.
            printf '%s\n' "$DEPLOY_SHA" > "${STATE_FILE}.tmp"
            mv "${STATE_FILE}.tmp" "$STATE_FILE"
            echo "Recorded successful production deployment: ${DEPLOY_SHA}"

            echo "Removing unused Docker images..."
            docker image prune -f
