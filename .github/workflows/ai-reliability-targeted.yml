name: AI reliability focused verification
on:
  push:
    branches: [build/ai-reliability-publisher-20261003]
    paths: [.github/workflows/ai-reliability-targeted.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Ashwani1611/shvya-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: shvya_ci
          POSTGRES_USER: shvya_ci
          POSTGRES_PASSWORD: shvya_ci_password
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U shvya_ci -d shvya_ci' --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: --health-cmd 'redis-cli ping' --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-key-not-for-production
      JWT_SECRET: ci-only-jwt-secret-not-for-production
      CREDENTIAL_ENCRYPTION_KEY: ci-only-credential-key-not-for-production
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: shvya_ci
      DB_USER: shvya_ci
      DB_PASSWORD: shvya_ci_password
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      REDIS_URL: redis://127.0.0.1:6379/0
      CHANNEL_LAYER_REDIS_URL: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 55727b025999b94c312da9dfebafa216f5649a5c
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run new database and contract regressions
        run: |
          set -euo pipefail
          pytest -vv apps/ai_engagement/tests/test_action_outcome_consistency.py apps/ai_engagement/tests/test_final_response_completion.py apps/ai_engagement/tests/test_knowledge_repair_integration.py apps/ai_engagement/tests/test_reliability_completion_contract.py apps/ai_engagement/tests/test_usage_observation_integration.py apps/channels/tests/test_instagram_outcome_consistency.py 2>&1 | tee focused-tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ai-reliability-focused-tests
          path: focused-tests.log
          retention-days: 3
