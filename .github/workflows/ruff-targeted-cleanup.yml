'''
          text = replace_once(text, old_logger, new_logger, "CRM authentication logger")
          save(path, text)

          # Remove dead import-preview queries/locals without changing CRM behavior.
          path = "apps/crm/views/dashboard.py"
          text = load(path)
          first_dead_query = '''    attribute_definitions = (
        AttributeDefinition.objects
        .filter(
            organization=user.organization,
        )
    )

'''
          text = replace_once(text, first_dead_query, "", "dashboard review unused attributes")
          second_dead_section = '''    # --------------------------------------------------------
    # EXISTING ATTRIBUTE DEFINITIONS
    # --------------------------------------------------------

    attribute_definitions = (
        AttributeDefinition.objects
        .filter(
            organization=user.organization,
        )
    )

    attribute_by_key = {
        attribute.key: attribute
        for attribute in attribute_definitions
    }

'''
          text = replace_once(text, second_dead_section, "", "dashboard existing attribute dead section")
          text = replace_once(
              text,
              "        lead = create_lead(\n            organization=user.organization,\n",
              "        create_lead(\n            organization=user.organization,\n",
              "dashboard unused created lead",
          )
          lead_table_old = '''def lead_table_partial(
    request
):

    user = request.crm_user

    organization = user.organization

    pipeline_id = request.GET.get(
'''
          lead_table_new = '''def lead_table_partial(
    request
):

    user = request.crm_user

    pipeline_id = request.GET.get(
'''
          text = replace_once(text, lead_table_old, lead_table_new, "lead table unused organization")
          delete_stage_old = '''def lead_stage_delete(
    request,
    stage_id,
):

    user = request.crm_user

    organization = user.organization

    pipeline_id = (
        request.POST.get(
            "pipeline",
            "",
        )
        .strip()
    )

    active_stage_id = (
'''
          delete_stage_new = '''def lead_stage_delete(
    request,
    stage_id,
):

    user = request.crm_user

    organization = user.organization

    active_stage_id = (
'''
          text = replace_once(text, delete_stage_old, delete_stage_new, "delete stage unused pipeline")
          save(path, text)
          PY

      - name: Commit targeted fixes
        run: |
          if git diff --quiet; then
            echo "No targeted changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps
          git commit -m "Fix Ruff baseline violations"
          git push origin HEAD:ci/enforce-full-ruff
