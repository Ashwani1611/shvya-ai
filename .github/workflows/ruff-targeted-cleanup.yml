name: Ruff Targeted Cleanup

on:
  push:
    branches: [ci/enforce-full-ruff]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ci/enforce-full-ruff

      - name: Apply targeted lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path); text = p.read_text(encoding="utf-8"); count = text.count(old)
              if count != 1: raise RuntimeError(f"{label}: expected 1 match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def regex_once(path, pattern, replacement, label):
              p = Path(path); text = p.read_text(encoding="utf-8"); updated, count = re.subn(pattern, replacement, text, count=1)
              if count != 1: raise RuntimeError(f"{label}: expected 1 match, found {count}")
              p.write_text(updated, encoding="utf-8")

          def replace_in_crm_view_once(path, function_name, old, new, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              start = text.index(f"def {function_name}(")
              next_view = text.find("\n@crm_login_required", start + 1)
              end = len(text) if next_view == -1 else next_view
              section = text[start:end]
              count = section.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected 1 match in {function_name}, found {count}")
              section = section.replace(old, new, 1)
              p.write_text(text[:start] + section + text[end:], encoding="utf-8")

          path = "apps/accounts/views_flat.py"
          regex_once(path, r'\nclass ThrottledTokenObtainPairView\(TokenObtainPairView\):\n    throttle_classes = \[ScopedRateThrottle\]\n    throttle_scope = "jwt_login"\n[ \t]*\n', '\n', "accounts JWT class removal")
          session_import = 'from .session_utils import (\n    delete_session_cookie,\n    get_session_store,\n    save_session_cookie,\n    set_authenticated_user,\n)\n'
          class_block = '\n\nclass ThrottledTokenObtainPairView(TokenObtainPairView):\n    throttle_classes = [ScopedRateThrottle]\n    throttle_scope = "jwt_login"\n'
          replace_once(path, session_import, session_import + class_block, "accounts JWT class insertion")
          replace_once(path, '            user = User.objects.create_user(\n', '            User.objects.create_user(\n', "accounts unused signup user")

          replace_once("apps/ai_engagement/services/conditional_qualification_runtime.py", '    original_missing = state_module._missing_ids\n\n', '', "conditional qualification unused original_missing")

          path = "apps/ai_engagement/services/engagement.py"
          policy = 'BACKEND_OPERATING_POLICY = (Path(__file__).resolve().parent.parent / "prompts" / "backend_operating_policy.md").read_text(encoding="utf-8")\n'
          replace_once(path, policy, '', "engagement policy removal")
          replace_once(path, '\n\nclass EngagementError(Exception):', '\n\n' + policy.rstrip('\n') + '\n\nclass EngagementError(Exception):', "engagement policy insertion")

          replace_once("apps/ai_engagement/services/qualification.py", '                normalize_question = lambda value: re.sub(r"\\W+", " ", str(value).casefold()).strip()\n', '                def normalize_question(value):\n                    return re.sub(r"\\W+", " ", str(value).casefold()).strip()\n', "qualification normalize_question")

          path = "apps/ai_engagement/services/qualification_crm_action_runtime.py"
          old = 'from __future__ import annotations\n\n"""Deprecated qualification CRM bridge.\n\nQualification attribute mapping and completion-stage execution are no longer\nimplemented here. The authoritative path is\n``qualification_execution_contract`` + ``qualification_execution_policy_guard``.\n\nA small reminder-time compatibility symbol remains because normal-conversation\nruntime modules historically imported it from this module. It delegates to the\nstandalone reminder parser and has no qualification authority.\n"""\n\nfrom apps.ai_engagement.services.reminder_time_runtime import parse_grounded_due_at\n'
          new = '"""Deprecated qualification CRM bridge.\n\nQualification attribute mapping and completion-stage execution are no longer\nimplemented here. The authoritative path is\n``qualification_execution_contract`` + ``qualification_execution_policy_guard``.\n\nA small reminder-time compatibility symbol remains because normal-conversation\nruntime modules historically imported it from this module. It delegates to the\nstandalone reminder parser and has no qualification authority.\n"""\n\nfrom __future__ import annotations\n\nfrom apps.ai_engagement.services.reminder_time_runtime import parse_grounded_due_at\n'
          replace_once(path, old, new, "qualification CRM header")

          path = "apps/ai_engagement/tests/test_knowledge_pipeline.py"
          regex_once(
              path,
              r'(def test_url_embedding_error_is_wrapped\([\s\S]*?\n\s*)document = Document\.objects\.create\(',
              r'\1Document.objects.create(',
              "knowledge pipeline unused embedding document",
          )

          path = "apps/channels/views_flat.py"
          replace_once(path, '    unread_count    = sum(1 for l in all_conversations if getattr(l, "unread_count", 0) > 0)\n    needs_reply_cnt = sum(1 for l in all_conversations if getattr(l, "last_msg_direction", "") == "inbound")\n    failed_cnt      = sum(1 for l in all_conversations if getattr(l, "last_msg_status", "") == "failed")\n', '    unread_count    = sum(1 for conversation in all_conversations if getattr(conversation, "unread_count", 0) > 0)\n    needs_reply_cnt = sum(1 for conversation in all_conversations if getattr(conversation, "last_msg_direction", "") == "inbound")\n    failed_cnt      = sum(1 for conversation in all_conversations if getattr(conversation, "last_msg_status", "") == "failed")\n', "channel badge counters")

          path = "apps/crm/authentication.py"
          replace_once(path, '\nlogger = logging.getLogger(__name__)\n\nfrom apps.crm.constants import CRM_SESSION_AREA\nfrom apps.organizations.models import APIKey\n', '\nfrom apps.crm.constants import CRM_SESSION_AREA\nfrom apps.organizations.models import APIKey\n\nlogger = logging.getLogger(__name__)\n', "CRM logger placement")

          path = "apps/crm/views/dashboard.py"
          attribute_query = '    attribute_definitions = (\n        AttributeDefinition.objects\n        .filter(\n            organization=user.organization,\n        )\n    )\n\n'
          replace_in_crm_view_once(path, "lead_import_destination_save", attribute_query, '', "destination-save dead attribute query")

          dead_attribute_section = '    # --------------------------------------------------------\n    # EXISTING ATTRIBUTE DEFINITIONS\n    # --------------------------------------------------------\n\n    attribute_definitions = (\n        AttributeDefinition.objects\n        .filter(\n            organization=user.organization,\n        )\n    )\n\n    attribute_by_key = {\n        attribute.key: attribute\n        for attribute in attribute_definitions\n    }\n\n'
          replace_in_crm_view_once(path, "lead_import_review_modal", dead_attribute_section, '', "review-modal dead attribute section")
          replace_in_crm_view_once(path, "lead_import_execute", '        lead = create_lead(\n            organization=user.organization,\n', '        create_lead(\n            organization=user.organization,\n', "execute unused lead")
          replace_in_crm_view_once(path, "lead_table_partial", '    organization = user.organization\n\n', '', "lead-table unused organization")
          unused_pipeline = '    pipeline_id = (\n        request.POST.get(\n            "pipeline",\n            "",\n        )\n        .strip()\n    )\n\n'
          replace_in_crm_view_once(path, "lead_stage_delete", unused_pipeline, '', "stage-delete unused pipeline")
          PY

      - name: Commit targeted fixes
        run: |
          if git diff --quiet; then
            echo "No targeted changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps
          git commit -m "Fix Ruff baseline violations"
          git push origin HEAD:ci/enforce-full-ruff
