name: Validate WhatsApp controls repair

on:
  push:
    branches: [fix/whatsapp-account-controls-20260918]
    paths: [.repair/whatsapp_controls.py]

permissions:
  contents: write

concurrency:
  group: whatsapp-controls-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.repository == 'Ashwani1611/shvya-ai' && github.ref == 'refs/heads/fix/whatsapp-account-controls-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SECRET_KEY: ci-only-secret-key-not-for-production
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: shvya_ci
      DB_USER: shvya_ci
      DB_PASSWORD: shvya_ci_password
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      REDIS_URL: redis://127.0.0.1:6379/0
      CHANNEL_LAYER_REDIS_URL: redis://127.0.0.1:6379/1
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: shvya_ci
          POSTGRES_USER: shvya_ci
          POSTGRES_PASSWORD: shvya_ci_password
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U shvya_ci -d shvya_ci' --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: --health-cmd 'redis-cli ping' --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/whatsapp-account-controls-20260918
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Apply reviewed source edits
        run: python .repair/whatsapp_controls.py
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate source and schema
        run: |
          ruff check .
          python manage.py makemigrations --check --dry-run --settings=config.settings.testing
          python manage.py check --settings=config.settings.testing
      - name: Regression tests
        run: |
          set -o pipefail
          pytest apps/channels/tests apps/followups apps/hosted_automation apps/ai_engagement --no-cov 2>&1 | tee /tmp/whatsapp-controls-tests.log
      - name: Save review diff
        if: always()
        run: |
          git diff > /tmp/whatsapp-controls.diff
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-controls-validation
          path: |
            /tmp/whatsapp-controls.diff
            /tmp/whatsapp-controls-tests.log
      - name: Commit validated application changes and remove repair tooling
        run: |
          git rm .github/workflows/repair-whatsapp-controls.yml .repair/whatsapp_controls.py
          git add services/channels/hosted_whatsapp_service.py services/channels/whatsapp_service.py services/channels/hosted_whatsapp_transport.py services/channels/hosted_automation_service.py services/followup_service.py apps/channels/tasks.py apps/ai_engagement/tasks.py apps/channels/tests/test_account_settings_controls.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: enforce WhatsApp account controls and live follow-up timing'
          git push origin HEAD:refs/heads/fix/whatsapp-account-controls-20260918
