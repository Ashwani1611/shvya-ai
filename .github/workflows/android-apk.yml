name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/call-intelligence/**"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main]
    paths:
      - "android/call-intelligence/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test, lint and build release APK
        run: gradle -p android/call-intelligence clean testReleaseUnitTest lintRelease assembleRelease assembleDebug --stacktrace

      - name: Prepare named APK
        run: |
          mkdir -p dist
          cp android/call-intelligence/app/build/outputs/apk/release/app-release.apk \
            dist/SHVYA-Call-Intelligence-v1.6.apk
          cp android/call-intelligence/app/build/outputs/apk/debug/app-debug.apk \
            dist/SHVYA-Call-Intelligence-v1.6-preview.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHVYA-Call-Intelligence-v1.6
          path: |
            dist/SHVYA-Call-Intelligence-v1.6.apk
            dist/SHVYA-Call-Intelligence-v1.6-preview.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-verification-reports
          path: |
            android/call-intelligence/app/build/reports/tests/
            android/call-intelligence/app/build/reports/lint-results-release.*
          if-no-files-found: warn
          retention-days: 14
