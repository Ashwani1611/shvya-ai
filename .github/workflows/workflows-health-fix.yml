name: Workflows health-pause correction
on:
  push:
    branches: [fix/workflows-runtime-source-editor]
    paths: [.github/workflows/workflows-health-fix.yml]
permissions:
  contents: write
jobs:
  correct:
    if: github.ref == 'refs/heads/fix/workflows-runtime-source-editor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Apply bounded workflow-only corrections and remove helper
        run: |
          set -eu
          python - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              assert text.count(old) == 1, path
              p.write_text(text.replace(old, new))
          replace('services/triggers/actions.py', '\n\n@transaction.atomic\ndef execute(run_id):', '''

          def defer_workflow_message_for_health(message):
              """Keep the same queued send until the existing Hosted health pause ends."""
              if message.account.connection_type != WhatsAppAccount.ConnectionType.coexisted:
                  return False
              from services.channels.hosted_health_guard import hosted_health_pause_until

              until = hosted_health_pause_until(account=message.account)
              if not until:
                  return False
              metadata = (message.raw_payload or {}).get("shvya_workflow") or {}
              return bool(TriggerRun.objects.filter(
                  id=metadata.get("run_id"), message_id=message.pk,
                  lead_id=message.lead_id, rule__organization_id=message.organization_id,
                  rule__enabled=True, rule__organization__is_active=True,
                  status__in=["queued", "dispatching"],
              ).update(
                  status="queued", due_at=until, finished_at=None,
                  detail="Waiting for the selected Hosted account's Account Health pause to end.",
              ))


          @transaction.atomic
          def execute(run_id):''')
          replace('services/triggers/actions.py', 'The selected WhatsApp API account is no longer connected.', 'The selected WhatsApp account is no longer connected.')
          replace('apps/channels/tasks.py', '                from services.triggers.actions import workflow_message_block_reason', '''                from services.triggers.actions import (
                              defer_workflow_message_for_health,
                              workflow_message_block_reason,
                          )''')
          replace('apps/channels/tasks.py', '                    return {"status": "skipped", "reason": reason, "message_id": str(message_id)}\n', '''                    return {"status": "skipped", "reason": reason, "message_id": str(message_id)}
                          if defer_workflow_message_for_health(message):
                              return {"status": "deferred", "reason": "account_health", "message_id": str(message_id)}
          ''')
          replace('apps/channels/tasks.py', '            from apps.triggers.models import TriggerRun\n', '''            from apps.triggers.models import TriggerRun
                      from services.triggers.actions import defer_workflow_message_for_health

                      if original.status_code == 503 and defer_workflow_message_for_health(message):
                          _requeue_whatsapp_message_after_transient_failure(message_id=message_id)
                          return {"status": "deferred", "reason": "account_health", "message_id": str(message_id)}
          ''')
          PY
          python -m compileall -q services/triggers/actions.py apps/channels/tasks.py
          rm .github/workflows/workflows-health-fix.yml
          git add services/triggers/actions.py apps/channels/tasks.py .github/workflows/workflows-health-fix.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Defer workflow sends through the existing Hosted Account Health pause'
          git push origin HEAD:refs/heads/fix/workflows-runtime-source-editor
