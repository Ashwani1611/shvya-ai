name: Apply Hosted single-path patch

on:
  push:
    branches:
      - fix/hosted-ai-single-path-context

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run Hosted single-path patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/hosted-ai-single-path-context
      - name: Remove duplicate Hosted persistence enqueue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/channels/hosted_whatsapp_service.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if (
        lead
        and pipeline
        and lead.pipeline_id == pipeline.id
        and not is_outbound
        and not historical
        and settings["ai_auto_reply"]
    ):
        def queue_ai_reply():
            from apps.ai_engagement.services.ai_permissions import AIPermissionService
            from services.channels.hosted_automation_service import enqueue_ai_engagement

            current_lead = (
                Lead.objects.select_related("organization", "pipeline", "stage")
                .filter(id=lead.id, organization=account.organization)
                .first()
            )
            if not current_lead or current_lead.pipeline_id != pipeline.id:
                return

            permission = AIPermissionService().evaluate(
                organization=account.organization,
                lead=current_lead,
            )
            if not permission.allowed:
                return

            enqueue_ai_engagement(
                account=account,
                lead=current_lead,
                source_message=message,
            )

        transaction.on_commit(queue_ai_reply)

'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one duplicate enqueue block, found {text.count(old)}')
          replacement = '''    # Hosted AI enqueueing is intentionally signal-owned. The post-save signal
    # resolves the final committed message identity (including LID repair and
    # live/history precedence) and creates at most one durable job for it.

'''
          path.write_text(text.replace(old, replacement), encoding='utf-8')
          PY
          git rm .github/workflows/temp-hosted-single-path.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/channels/hosted_whatsapp_service.py
          git commit -m 'Consolidate Hosted AI enqueue to persisted message signal'
          git push origin HEAD:fix/hosted-ai-single-path-context
