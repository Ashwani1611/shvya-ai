name: Apply New Lead qualification fixes

on:
  push:
    branches:
      - fix/new-lead-qualification-orchestration

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/new-lead-qualification-orchestration
          fetch-depth: 0
      - name: Apply scoped fixes
        run: python .github/scripts/apply_new_lead_qualification_fixes.py
      - name: Commit scoped fixes
        run: |
          rm .github/workflows/apply-new-lead-qualification-fixes.yml
          rm .github/scripts/apply_new_lead_qualification_fixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[new-lead-fixes-applied] Enforce New Lead qualification lifecycle"
          git push origin HEAD:fix/new-lead-qualification-orchestration
