name: AI source audit workspace
on:
  push:
    branches: [audit/ai-phases-source-20260918]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Export empty CI-compatible PostgreSQL runtime
        run: |
          docker create --name postgres-audit pgvector/pgvector:pg17
          docker export postgres-audit | gzip > /tmp/postgres-audit-rootfs.tar.gz
          docker rm postgres-audit
      - uses: actions/upload-artifact@v4
        with:
          name: shvya-ai-audit-postgres
          path: /tmp/postgres-audit-rootfs.tar.gz
          retention-days: 1
