name: Assemble verified AI evaluation isolation
on:
  push:
    branches: [audit/ai-phases-source-20260918]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply checksum-verified isolation patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/isolation.b64 <<'PATCH'
          
          PATCH
          base64 --decode /tmp/isolation.b64 | xz --decompress > /tmp/isolation.patch
          echo '9411c680d829325da0c11bb7c70978900e7c3d4fe9be24a21ea645a07997ed04  /tmp/isolation.patch' | sha256sum --check
          BASE=4b74b5c68752ec42e63c97b145c0b6fc03951f6e
          TARGET=fix/ai-phases-1-11
          test "$(git ls-remote origin refs/heads/$TARGET | cut -f1)" = "$BASE"
          git checkout --detach "$BASE"
          git apply --index /tmp/isolation.patch
          git diff --cached --check
          test "$(git write-tree)" = 443de43114d06b4ff6627212f071719e4f947393
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Isolate recorded AI evaluation from live caches, queues and media' -m 'Keep full CI testing.py with real Redis unchanged; evaluation subprocess uses dedicated process-local settings, a separate test database namespace and temporary media. Local recorded evaluation: 169 tests and 33 subtests passed.'
          git push origin "HEAD:refs/heads/$TARGET"
          git rev-parse HEAD
