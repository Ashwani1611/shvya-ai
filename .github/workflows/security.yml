name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Security change plan
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      python: ${{ steps.plan.outputs.python }}
      gateway: ${{ steps.plan.outputs.gateway }}
      docker_app: ${{ steps.plan.outputs.docker_app }}
      compose: ${{ steps.plan.outputs.compose }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Build security plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          args=(--head "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT")
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            args+=(--force-full)
          else
            args+=(--base "$BASE_SHA")
          fi
          python scripts/ci_change_plan.py "${args[@]}"

  python-security:
    name: Python dependency audit and SAST
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || needs.plan.outputs.full == 'true' || needs.plan.outputs.python == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --strict

      - name: High-severity Python SAST
        run: bandit -r apps services config -lll -iii -x "*/tests/*"

  node-security:
    name: Node dependency audit and lockfile
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || needs.plan.outputs.full == 'true' || needs.plan.outputs.gateway == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install exact gateway dependency graph
        working-directory: whatsapp_web_gateway
        run: npm ci --ignore-scripts

      - name: Audit gateway production dependencies
        working-directory: whatsapp_web_gateway
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-filesystem:
    name: Filesystem security and SBOM
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Scan secrets and misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shvya-cyclonedx-sbom
          path: sbom.cdx.json
          if-no-files-found: error

  container-security:
    name: Container vulnerability scan
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || needs.plan.outputs.full == 'true' || needs.plan.outputs.docker_app == 'true' || needs.plan.outputs.gateway == 'true' || needs.plan.outputs.compose == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build application image
        run: docker build --tag shvya-security:${{ github.sha }} .

      - name: Scan application image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: shvya-security:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build Hosted gateway image
        run: docker build --tag shvya-hosted-security:${{ github.sha }} ./whatsapp_web_gateway

      - name: Scan Hosted gateway image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: shvya-hosted-security:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
