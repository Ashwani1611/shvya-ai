name: Workflows import correction
on:
  push:
    branches: [fix/workflows-runtime-source-editor]
    paths: [.github/workflows/workflows-import-fix.yml]
permissions:
  contents: write
jobs:
  correct:
    if: github.ref == 'refs/heads/fix/workflows-runtime-source-editor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Correct timestamp import and remove this one-shot helper
        run: |
          set -eu
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/channels/tasks.py')
          text = p.read_text()
          anchor = 'from django.db import transaction\n'
          assert text.count(anchor) == 1
          assert 'from django.utils import timezone\n' not in text
          p.write_text(text.replace(anchor, anchor + 'from django.utils import timezone\n'))
          PY
          rm .github/workflows/workflows-import-fix.yml
          git add apps/channels/tasks.py .github/workflows/workflows-import-fix.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import timezone for workflow retry terminal timestamps'
          git push origin HEAD:refs/heads/fix/workflows-runtime-source-editor
