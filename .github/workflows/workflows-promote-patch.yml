name: Prepare focused Workflows release
on:
  push:
    branches: [release/workflows-runtime-source-editor]
    paths: [.github/workflows/workflows-promote-patch.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/release/workflows-runtime-source-editor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply only the reviewed Workflows diff to current main baseline
        run: |
          set -eu
          SOURCE_BASE=cb9e541cda8548e3a4256ab65f0f23684e8ca81f
          SOURCE_HEAD=9b3ab51426d946517d7c211e3a115ee4964e8a6f
          git fetch --no-tags origin "$SOURCE_BASE" "$SOURCE_HEAD"
          git diff --name-only "$SOURCE_BASE" "$SOURCE_HEAD" > /tmp/workflows-paths.txt
          python - <<'PY'
          from pathlib import Path
          expected = {
              'apps/channels/tasks.py', 'apps/triggers/signals.py', 'apps/triggers/tasks.py',
              'apps/triggers/tests/test_connected_email_delivery.py',
              'apps/triggers/tests/test_workflows_boundaries.py',
              'apps/triggers/tests/test_workflows_presentation.py',
              'apps/triggers/tests/test_workflows_runtime_contract.py',
              'docs/workflows-runtime-contract.md',
              'services/channels/hosted_health_guard.py',
              'services/channels/hosted_whatsapp_transport.py',
              'services/channels/whatsapp_service.py',
              'services/triggers/actions.py', 'services/triggers/evaluator.py',
              'services/triggers/rules.py', 'static/triggers/apple_workflows.css',
              'static/triggers/dashboard.js', 'templates/triggers/dashboard.html',
          }
          actual = set(Path('/tmp/workflows-paths.txt').read_text().splitlines())
          assert actual == expected, (actual - expected, expected - actual)
          PY
          git diff --binary "$SOURCE_BASE" "$SOURCE_HEAD" > /tmp/workflows.patch
          git apply --3way --index /tmp/workflows.patch
          python - <<'PY'
          from pathlib import Path
          p = Path('services/triggers/evaluator.py')
          original = p.read_bytes()
          normalized = original.replace(b'\r\n', b'\n')
          assert original.decode().splitlines() == normalized.decode().splitlines()
          p.write_bytes(normalized)
          PY
          node --check static/triggers/dashboard.js
          python -m compileall -q services/triggers apps/triggers apps/channels/tasks.py
          rm .github/workflows/workflows-promote-patch.yml
          git add -u
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Promote the focused Workflows runtime and editor fixes for main CI review'
          git diff --exit-code 03161c1dbbd4e35cb41a6fc0871ff68afd856619 HEAD -- .github
          git push origin HEAD:refs/heads/release/workflows-runtime-source-editor
          mkdir -p /tmp/workflows-release-source
          git archive HEAD | tar -x -C /tmp/workflows-release-source
          git rev-parse HEAD > /tmp/workflows-release-source/REVIEW_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: workflows-release-source
          path: /tmp/workflows-release-source/
          include-hidden-files: true
          retention-days: 1
