name: Apply Hosted live/history precedence fix

on:
  push:
    branches: ["fix/hosted-live-history-precedence"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch Hosted message precedence and regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path("services/channels/hosted_chat_service.py")
          text = service_path.read_text(encoding="utf-8")
          old = '''    merged = dict(_payload(message))
              incoming = {k: v for k, v in payload.items() if v is not None}
              if _is_lid_derived_phone(incoming.get("peerPhone"), raw_chat_id):
                  incoming.pop("peerPhone", None)
              if _is_lid_derived_phone(incoming.get("peerKey"), raw_chat_id):
                  incoming.pop("peerKey", None)
              merged.update(incoming)
              if key:
                  merged["peerKey"] = key
              if peer_phone:
                  merged["peerPhone"] = peer_phone
              if raw_chat_id:
                  merged["rawChatId"] = raw_chat_id
              if historical or merged.get("isHistory"):
                  merged["isHistory"] = True
          '''.replace("              ", "    ")
          new = '''    existing_payload = _payload(message)
              was_history = bool(existing_payload.get("isHistory"))
              merged = dict(existing_payload)
              incoming = {k: v for k, v in payload.items() if v is not None}
              if _is_lid_derived_phone(incoming.get("peerPhone"), raw_chat_id):
                  incoming.pop("peerPhone", None)
              if _is_lid_derived_phone(incoming.get("peerKey"), raw_chat_id):
                  incoming.pop("peerKey", None)
              merged.update(incoming)
              if key:
                  merged["peerKey"] = key
              if peer_phone:
                  merged["peerPhone"] = peer_phone
              if raw_chat_id:
                  merged["rawChatId"] = raw_chat_id

              # Realtime delivery is authoritative. History sync may enrich an
              # existing live row, but it must never downgrade that row back to
              # history. Conversely, seeing the same WhatsApp message through the
              # realtime callback promotes a previously imported history row to live.
              merged["isHistory"] = was_history if historical else False
          '''.replace("              ", "    ")
          if old not in text:
              raise SystemExit("Expected Hosted identity-repair block was not found")
          service_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          test_path = Path("apps/channels/tests/test_hosted_chat_complete_sync.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "test_history_sync_cannot_downgrade_live_message"
          if marker not in tests:
              tests += '''

              def test_history_message_is_promoted_when_same_message_arrives_live(self):
                  raw_chat_id = "423456789012@lid"
                  real_phone = "+919844445555"
                  item = self._resolved_item(
                      message_id="HISTORY-THEN-LIVE-1",
                      phone=real_phone,
                      raw_chat_id=raw_chat_id,
                      body="Same message",
                  )

                  handle_hosted_gateway_event(
                      payload={
                          "sessionId": str(self.account.id),
                          "event": "history_sync",
                          "messages": [item],
                      }
                  )
                  from apps.channels.models import WhatsAppMessage
                  message = WhatsAppMessage.objects.get(external_id="wweb:HISTORY-THEN-LIVE-1")
                  self.assertTrue(message.raw_payload.get("isHistory"))

                  handle_hosted_gateway_event(
                      payload={
                          "sessionId": str(self.account.id),
                          "event": "message",
                          **item,
                      }
                  )
                  message.refresh_from_db()
                  self.assertFalse(message.raw_payload.get("isHistory"))

              def test_history_sync_cannot_downgrade_live_message(self):
                  raw_chat_id = "523456789012@lid"
                  real_phone = "+919855556666"
                  item = self._resolved_item(
                      message_id="LIVE-THEN-HISTORY-1",
                      phone=real_phone,
                      raw_chat_id=raw_chat_id,
                      body="Realtime wins",
                  )

                  handle_hosted_gateway_event(
                      payload={
                          "sessionId": str(self.account.id),
                          "event": "message",
                          **item,
                      }
                  )
                  from apps.channels.models import WhatsAppMessage
                  message = WhatsAppMessage.objects.get(external_id="wweb:LIVE-THEN-HISTORY-1")
                  self.assertFalse(message.raw_payload.get("isHistory"))

                  handle_hosted_gateway_event(
                      payload={
                          "sessionId": str(self.account.id),
                          "event": "history_sync",
                          "messages": [item],
                      }
                  )
                  message.refresh_from_db()
                  self.assertFalse(message.raw_payload.get("isHistory"))

              def test_history_only_message_remains_history(self):
                  item = self._resolved_item(
                      message_id="HISTORY-ONLY-1",
                      phone="+919866667777",
                      raw_chat_id="623456789012@lid",
                      body="Imported history",
                  )
                  handle_hosted_gateway_event(
                      payload={
                          "sessionId": str(self.account.id),
                          "event": "history_sync",
                          "messages": [item],
                      }
                  )
                  from apps.channels.models import WhatsAppMessage
                  message = WhatsAppMessage.objects.get(external_id="wweb:HISTORY-ONLY-1")
                  self.assertTrue(message.raw_payload.get("isHistory"))
          '''.replace("              ", "    ")
              test_path.write_text(tests, encoding="utf-8")

          Path(".github/workflows/apply-hosted-history-precedence-fix.yml").unlink()
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/channels/hosted_chat_service.py apps/channels/tests/test_hosted_chat_complete_sync.py .github/workflows/apply-hosted-history-precedence-fix.yml
          git commit -m "Fix Hosted live/history message precedence"
          git push origin HEAD:fix/hosted-live-history-precedence
