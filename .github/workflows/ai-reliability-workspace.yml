name: Publish reviewed AI reliability patch
on:
  push:
    branches: [fix/ai-engagement-completion-20261003]
    paths: [.github/workflows/ai-reliability-workspace.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'Ashwani1611/shvya-ai' && github.ref == 'refs/heads/fix/ai-engagement-completion-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify and apply reviewed source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          shas = ['791b81706c0a084bff15f70c81afe6742eed3233', '5e63fe01a171295844bb7c0dcb6df73ebf60f89c', '2dab0e84cb353e32751385fc3b9d65f5a0bcefcc', '5edf367edd2401399e66ece02e65aa4cd87ea074', '190cc359f7fb7511a25dab7f2ae219937732d4a3']
          parts = []
          for sha in shas:
              req = urllib.request.Request('https://api.github.com/repos/Ashwani1611/shvya-ai/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)
              content = base64.b64decode(data['content'])
              if hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest() != sha:
                  raise SystemExit('Source transfer hash mismatch')
              parts.append(content)
          patch = lzma.decompress(base64.b64decode(b''.join(parts), validate=True), memlimit=256*1024*1024)
          if hashlib.sha256(patch).hexdigest() != '903c10f1b716f02b6b7806740e358eb5fbdfd3302a9715f861d669f914ed27cd':
              raise SystemExit('Reviewed patch hash mismatch')
          target = pathlib.Path('/tmp/ai-reliability.patch')
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', str(target)], check=True)
          PY
      - name: Validate source and remove branch-only bootstrap
        run: |
          set -euo pipefail
          python -m compileall -q apps/ai_engagement services/channels apps/channels/tests
          python -m unittest apps.ai_engagement.tests.test_reliability_completion_contract apps.ai_engagement.tests.test_evidence_recovery_contract -v
          git rm .github/workflows/ai-reliability-workspace.yml
          git add apps/ai_engagement apps/channels/tests services/channels docs
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete source-bound AI actions, Instagram outcomes, final reply recovery and knowledge operations'
          git push origin HEAD:refs/heads/fix/ai-engagement-completion-20261003
