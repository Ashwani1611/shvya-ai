name: Bootstrap Gateway Lockfile

on:
  push:
    branches: [security/remaining-hardening]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/remaining-hardening
      - name: Generate audited lockfile
        working-directory: whatsapp_web_gateway
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Commit lockfile
        run: |
          if git diff --quiet -- whatsapp_web_gateway/package-lock.json && git ls-files --error-unmatch whatsapp_web_gateway/package-lock.json >/dev/null 2>&1; then
            echo "Lockfile already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whatsapp_web_gateway/package-lock.json
          git commit -m "Security: commit audited Hosted gateway lockfile"
          git push origin HEAD:security/remaining-hardening
