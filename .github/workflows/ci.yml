name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  SECRET_KEY: "ci-only-secret-key-not-for-production"
  DEBUG: "False"
  ALLOWED_HOSTS: "localhost,127.0.0.1"
  DB_NAME: shvya_ci
  DB_USER: shvya_ci
  DB_PASSWORD: shvya_ci_password
  DB_HOST: 127.0.0.1
  DB_PORT: "5432"
  REDIS_URL: redis://127.0.0.1:6379/0
  CHANNEL_LAYER_REDIS_URL: redis://127.0.0.1:6379/1

jobs:
  test:
    name: Lint, checks and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: shvya_ci
          POSTGRES_USER: shvya_ci
          POSTGRES_PASSWORD: shvya_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shvya_ci -d shvya_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.testing

      - name: Django system check
        run: python manage.py check --settings=config.settings.testing

      - name: Run tests with coverage
        run: pytest --cov

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --tag shvya-ai:${{ github.sha }} .
