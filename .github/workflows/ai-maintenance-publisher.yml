name: Prepare reviewed AI reliability correction
on:
  push:
    branches: [build/ai-reliability-publisher-20261003]
    paths: [.github/workflows/ai-maintenance-publisher.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'Ashwani1611/shvya-ai' && github.ref == 'refs/heads/build/ai-reliability-publisher-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create reviewed correction commit without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request
          root = 'https://api.github.com/repos/Ashwani1611/shvya-ai'
          def api(path, data=None):
              request = urllib.request.Request(root + path, data=json.dumps(data).encode() if data is not None else None,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          manifest = json.loads(base64.b64decode(api('/git/blobs/693b22ae0daa03465b7e51b3ba38b4cf0a27a712')['content']))
          parent = manifest['parent']
          if parent != '55727b025999b94c312da9dfebafa216f5649a5c':
              raise SystemExit('Unexpected parent')
          files = {}
          for edit in manifest['edits']:
              path = edit['path']
              if not path.startswith(('apps/ai_engagement/', 'services/channels/')) or '..' in path:
                  raise SystemExit('Unexpected source path')
              if path not in files:
                  files[path] = base64.b64decode(api('/contents/' + path + '?ref=' + parent)['content']).decode()
              if 'append' in edit:
                  files[path] += edit['append']
              else:
                  if files[path].count(edit['old']) != 1:
                      raise SystemExit('Correction precondition failed: ' + path)
                  files[path] = files[path].replace(edit['old'], edit['new'], 1)
          entries = []
          for path, text in files.items():
              compile(text, path, 'exec')
              blob = api('/git/blobs', {'content': text, 'encoding': 'utf-8'})
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
              print('SOURCE_BLOB ' + path + ' ' + blob['sha'])
          base = api('/git/commits/' + parent)
          tree = api('/git/trees', {'base_tree': base['tree']['sha'], 'tree': entries})
          commit = api('/git/commits', {'message': manifest['message'], 'tree': tree['sha'], 'parents': [parent]})
          print('REVIEWED_COMMIT=' + commit['sha'])
          print('REVIEWED_TREE=' + tree['sha'])
          PY
