services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    expose:
      - "5432"


  redis:
    image: redis:8-alpine
    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    expose:
      - "6379"


  web:
    build: .
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0

    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    command:
      - sh
      - -c
      - >
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --workers 3

    ports:
      - "127.0.0.1:8000:8000"
    expose:
      - "8000"


  ws:
    build: .
    restart: unless-stopped

    # Separate from `web` on purpose: gunicorn (WSGI) cannot serve
    # WebSocket connections, so live chat updates need their own
    # ASGI process. Kept as its own container rather than
    # replacing `web`'s entrypoint so a problem here can never
    # take down normal page loads -- worst case, the frontend
    # falls back to its periodic-reload safety net.
    #
    # Not exposed to the host directly -- nginx proxies /ws/ to
    # it over the internal compose network only (see
    # nginx/conf.d/dashboard.conf).

    env_file:
      - .env

    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    command:
      - daphne
      - -b
      - "0.0.0.0"
      - -p
      - "8001"
      - config.asgi:application

    expose:
      - "8001"


  worker:
    build: .
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0

    volumes:
      - media_volume:/app/media

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    command:
      - celery
      - -A
      - config
      - worker
      - -l
      - info


  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ${STATIC_SITE_PATH:-./frontend}:/usr/share/nginx/shvya-ai:ro


    depends_on:
      - web
      - ws


  certbot:
    image: certbot/certbot

    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot

    entrypoint:
      - /bin/sh
      - -c
      - >
        trap exit TERM;
        while :;
        do
          certbot renew;
          sleep 12h & wait $${!};
        done;


volumes:
  postgres_data:

  static_volume:
    driver: local
    driver_opts:
      type: none
      device: /opt/shvya-ai/staticfiles
      o: bind

  media_volume:
    driver: local
    driver_opts:
      type: none
      device: /opt/shvya-ai/media
      o: bind