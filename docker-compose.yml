services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    expose:
      - "5432"


  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-500}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-40}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-10}
      MAX_DB_CONNECTIONS: ${PGBOUNCER_MAX_DB_CONNECTIONS:-60}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:8-alpine
    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    expose:
      - "6379"


  web:
    build: .
    image: shvya-ai-app:latest
    restart: unless-stopped
    deploy:
      replicas: ${WEB_REPLICAS:-1}
    scale: ${WEB_REPLICAS:-1}

    env_file:
      - .env

    environment:
      APP_ENV: production
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_USE_PGBOUNCER: "True"
      DB_CONN_MAX_AGE: "0"
      REDIS_URL: redis://redis:6379/0

    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

    depends_on:
      pgbouncer:
        condition: service_healthy

      redis:
        condition: service_healthy

    # Migrations and collectstatic are performed by the deploy workflow before
    # this container is replaced. Keeping startup limited to Gunicorn reduces
    # the window where Nginx has no ready upstream during production deploys.
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - ${GUNICORN_WORKERS:-3}

    # Require the real dependency readiness endpoint to succeed. This prevents
    # redirects, auth errors, missing routes, and other 4xx responses from
    # incorrectly marking the web container healthy.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import http.client; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=3); c.request('GET','/health/ready/',headers={'Host':'dashboard.shvya-ai.com','X-Forwarded-Proto':'https'}); r=c.getresponse(); raise SystemExit(0 if r.status == 200 else 1)\"",
        ]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

    expose:
      - "8000"


  ws:
    build: .
    image: shvya-ai-app:latest
    restart: unless-stopped
    deploy:
      replicas: ${ASGI_REPLICAS:-1}
    scale: ${ASGI_REPLICAS:-1}

    # Separate from `web` on purpose: gunicorn (WSGI) cannot serve
    # WebSocket connections, so live chat updates need their own
    # ASGI process.

    env_file:
      - .env

    environment:
      APP_ENV: production
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_USE_PGBOUNCER: "True"
      DB_CONN_MAX_AGE: "0"
      REDIS_URL: redis://redis:6379/0

    depends_on:
      pgbouncer:
        condition: service_healthy

      redis:
        condition: service_healthy

    command:
      - daphne
      - -b
      - "0.0.0.0"
      - -p
      - "8001"
      - config.asgi:application

    expose:
      - "8001"


  worker:
    build: .
    image: shvya-ai-app:latest
    restart: unless-stopped
    deploy:
      replicas: ${CELERY_GENERAL_REPLICAS:-1}
    scale: ${CELERY_GENERAL_REPLICAS:-1}

    env_file:
      - .env

    environment:
      APP_ENV: production
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_USE_PGBOUNCER: "True"
      DB_CONN_MAX_AGE: "0"
      REDIS_URL: redis://redis:6379/0

    volumes:
      - media_volume:/app/media

    depends_on:
      pgbouncer:
        condition: service_healthy

      redis:
        condition: service_healthy

    command:
      - celery
      - -A
      - config
      - worker
      - -l
      - info
      - -Q
      - celery
      - --concurrency=${CELERY_GENERAL_CONCURRENCY:-4}
      - --prefetch-multiplier=1


  ai_realtime_worker:
    build: .
    image: shvya-ai-app:latest
    restart: unless-stopped
    deploy:
      replicas: ${CELERY_AI_REALTIME_REPLICAS:-1}
    scale: ${CELERY_AI_REALTIME_REPLICAS:-1}

    # Customer-facing WhatsApp API AI replies get their own Celery lane so
    # summaries, knowledge ingestion, follow-ups, and other background tasks
    # cannot create head-of-line delays for engagement.
    env_file:
      - .env

    environment:
      APP_ENV: production
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_USE_PGBOUNCER: "True"
      DB_CONN_MAX_AGE: "0"
      REDIS_URL: redis://redis:6379/0

    volumes:
      - media_volume:/app/media

    depends_on:
      pgbouncer:
        condition: service_healthy

      redis:
        condition: service_healthy

    command:
      - celery
      - -A
      - config
      - worker
      - -l
      - info
      - -Q
      - ai_realtime
      - --concurrency=${CELERY_AI_REALTIME_CONCURRENCY:-2}
      - --prefetch-multiplier=1


  hosted_ai_worker:
    build: .
    image: shvya-ai-app:latest
    restart: unless-stopped
    deploy:
      replicas: ${CELERY_HOSTED_AI_REPLICAS:-1}
    scale: ${CELERY_HOSTED_AI_REPLICAS:-1}

    # Hosted Account AI keeps its durable delayed DB queue, but due-time wakes
    # and actual AI processing run independently of the general worker so a
    # background backlog cannot leave queued Hosted engagement stranded.
    env_file:
      - .env

    environment:
      APP_ENV: production
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_USE_PGBOUNCER: "True"
      DB_CONN_MAX_AGE: "0"
      REDIS_URL: redis://redis:6379/0

    volumes:
      - media_volume:/app/media

    depends_on:
      pgbouncer:
        condition: service_healthy

      redis:
        condition: service_healthy

    command:
      - celery
      - -A
      - config
      - worker
      - -l
      - info
      - -Q
      - hosted_ai
      - --concurrency=${CELERY_HOSTED_AI_CONCURRENCY:-1}
      - --prefetch-multiplier=1


  campaign_worker:
    build: .
    image: shvya-ai-app:latest
    restart: unless-stopped
    deploy:
      replicas: ${CELERY_CAMPAIGN_REPLICAS:-1}
    scale: ${CELERY_CAMPAIGN_REPLICAS:-1}
    env_file: [.env]
    environment:
      APP_ENV: production
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_USE_PGBOUNCER: "True"
      DB_CONN_MAX_AGE: "0"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media_volume:/app/media
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "campaigns", "--concurrency=${CELERY_CAMPAIGN_CONCURRENCY:-2}", "--prefetch-multiplier=1"]


  ingestion_worker:
    build: .
    image: shvya-ai-app:latest
    restart: unless-stopped
    deploy:
      replicas: ${CELERY_INGESTION_REPLICAS:-1}
    scale: ${CELERY_INGESTION_REPLICAS:-1}
    env_file: [.env]
    environment:
      APP_ENV: production
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_USE_PGBOUNCER: "True"
      DB_CONN_MAX_AGE: "0"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media_volume:/app/media
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "ingestion", "--concurrency=${CELERY_INGESTION_CONCURRENCY:-2}", "--prefetch-multiplier=1"]


  automation_worker:
    build: .
    image: shvya-ai-app:latest
    restart: unless-stopped
    deploy:
      replicas: ${CELERY_AUTOMATION_REPLICAS:-1}
    scale: ${CELERY_AUTOMATION_REPLICAS:-1}
    env_file: [.env]
    environment:
      APP_ENV: production
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_USE_PGBOUNCER: "True"
      DB_CONN_MAX_AGE: "0"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "automation", "--concurrency=${CELERY_AUTOMATION_CONCURRENCY:-2}", "--prefetch-multiplier=1"]


  beat:
    build: .
    image: shvya-ai-app:latest
    restart: unless-stopped

    env_file:
      - .env

    environment:
      APP_ENV: production
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_USE_PGBOUNCER: "True"
      DB_CONN_MAX_AGE: "0"
      REDIS_URL: redis://redis:6379/0

    depends_on:
      pgbouncer:
        condition: service_healthy

      redis:
        condition: service_healthy

    command:
      - celery
      - -A
      - config
      - beat
      - -l
      - info


  whatsapp-web-gateway:
    build:
      context: ./whatsapp_web_gateway
    restart: unless-stopped
    # Reap orphaned Chromium descendants and forward stop signals to Node.
    init: true
    stop_grace_period: 60s

    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379/4
      WHATSAPP_WEB_GATEWAY_SHARD: ${WHATSAPP_WEB_GATEWAY_SHARD:-primary}
      WHATSAPP_WEB_GATEWAY_INSTANCE_ID: ${WHATSAPP_WEB_GATEWAY_INSTANCE_ID:-}
      WHATSAPP_WEB_MAX_SESSIONS: ${WHATSAPP_WEB_MAX_SESSIONS:-50}
      WHATSAPP_WEB_SESSION_PATH: /data/wwebjs_auth
      SHVYA_HOSTED_CALLBACK_URL: http://web:8000/dashboard/whatsapp/connect/hosted/events/

    volumes:
      - whatsapp_sessions:/data/wwebjs_auth

    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

    expose:
      - "3000"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ${STATIC_SITE_PATH:-./frontend}:/usr/share/nginx/shvya-ai:ro

    depends_on:
      - web
      - ws


  certbot:
    image: certbot/certbot

    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot

    entrypoint:
      - /bin/sh
      - -c
      - >
        trap exit TERM;
        while :;
        do
          certbot renew;
          sleep 12h & wait $${!};
        done;


volumes:
  postgres_data:

  static_volume:
    driver: local
    driver_opts:
      type: none
      device: /opt/shvya-ai/staticfiles
      o: bind

  media_volume:
    driver: local
    driver_opts:
      type: none
      device: /opt/shvya-ai/media
      o: bind

  whatsapp_sessions:
