services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    expose:
      - "5432"


  redis:
    image: redis:8-alpine
    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    expose:
      - "6379"


  web:
    build: .
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0

    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    # Migrations and collectstatic are performed by the deploy workflow before
    # this container is replaced. Keeping startup limited to Gunicorn reduces
    # the window where Nginx has no ready upstream during production deploys.
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "3"

    # The site root redirects unauthenticated users, so the health check must
    # accept any valid HTTP response instead of treating redirects as failure.
    # urllib normally follows redirects, which can loop through the public
    # hostname/HTTPS path and incorrectly mark a healthy Gunicorn as unhealthy.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import http.client; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=3); c.request('GET','/'); r=c.getresponse(); raise SystemExit(0 if 100 <= r.status < 500 else 1)\"",
        ]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

    ports:
      - "127.0.0.1:8000:8000"

    expose:
      - "8000"


  ws:
    build: .
    restart: unless-stopped

    # Separate from `web` on purpose: gunicorn (WSGI) cannot serve
    # WebSocket connections, so live chat updates need their own
    # ASGI process.

    env_file:
      - .env

    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    command:
      - daphne
      - -b
      - "0.0.0.0"
      - -p
      - "8001"
      - config.asgi:application

    expose:
      - "8001"


  worker:
    build: .
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0

    volumes:
      - media_volume:/app/media

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    command:
      - celery
      - -A
      - config
      - worker
      - -l
      - info


  beat:
    build: .
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    command:
      - celery
      - -A
      - config
      - beat
      - -l
      - info


  whatsapp-web-gateway:
    build:
      context: ./whatsapp_web_gateway
    restart: unless-stopped

    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379/0
      WHATSAPP_WEB_SESSION_PATH: /data/wwebjs_auth
      SHVYA_HOSTED_CALLBACK_URL: http://web:8000/dashboard/whatsapp/connect/hosted/events/

    volumes:
      - whatsapp_sessions:/data/wwebjs_auth

    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

    expose:
      - "3000"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ${STATIC_SITE_PATH:-./frontend}:/usr/share/nginx/shvya-ai:ro

    depends_on:
      - web
      - ws


  certbot:
    image: certbot/certbot

    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot

    entrypoint:
      - /bin/sh
      - -c
      - >
        trap exit TERM;
        while :;
        do
          certbot renew;
          sleep 12h & wait $${!};
        done;


volumes:
  postgres_data:

  static_volume:
    driver: local
    driver_opts:
      type: none
      device: /opt/shvya-ai/staticfiles
      o: bind

  media_volume:
    driver: local
    driver_opts:
      type: none
      device: /opt/shvya-ai/media
      o: bind

  whatsapp_sessions:
