<div
    class="
        fixed
        inset-0
        z-50
        bg-black/40
        flex
        items-center
        justify-center
        p-4
    "
>

    <div
        class="
            bg-white
            rounded-2xl
            w-full
            max-w-lg
            shadow-2xl
            overflow-hidden
        "
    >

        <!-- =================================================
             HEADER
             ================================================= -->

        <div
            class="
                flex
                items-center
                justify-between
                px-5
                py-4
                border-b
                border-gray-200
            "
        >

            <div>

                <h2
                    class="
                        text-lg
                        font-semibold
                        tracking-tight
                        text-gray-900
                    "
                >
                    Import Leads
                </h2>

                <p
                    class="
                        mt-1
                        text-xs
                        text-gray-400
                    "
                >
                    Upload your file
                </p>

            </div>


            <button
                type="button"

                onclick="
                    document.getElementById('modal-root').innerHTML=''
                "

                class="
                    flex
                    h-8
                    w-8
                    items-center
                    justify-center
                    rounded-lg
                    text-gray-400
                    transition-all
                    duration-150

                    hover:bg-blue-50
                    hover:text-[#3B82F6]
                "

                aria-label="Close"
            >
                <i class="ti ti-x text-lg"></i>
            </button>

        </div>


        <!-- =================================================
             UPLOAD FORM
             ================================================= -->

        <form
            method="post"

            enctype="multipart/form-data"

            hx-post="{% url 'crm-lead-import-upload' %}"

            hx-target="#modal-root"

            hx-swap="none"

            hx-encoding="multipart/form-data"

            class="
                p-5
                space-y-5
            "
        >

            {% csrf_token %}


            <input
                type="hidden"
                name="import_token"
                value="{{ import_token }}"
            >


            <!-- =================================================
                 FILE UPLOAD
                 ================================================= -->

            <label
                for="lead-import-file"

                class="
                    group
                    block
                    cursor-pointer
                    rounded-2xl
                    border-2
                    border-dashed
                    border-gray-200
                    bg-white
                    px-6
                    py-9
                    text-center
                    transition-all
                    duration-200

                    hover:border-[#3B82F6]
                    hover:bg-blue-50/40
                "
            >

                <!-- UPLOAD ICON TILE -->

                <div
                    class="
                        mx-auto
                        flex
                        h-14
                        w-14
                        items-center
                        justify-center
                        rounded-2xl
                        bg-gray-50
                        text-gray-500
                        transition-all
                        duration-200

                        group-hover:bg-blue-50
                        group-hover:text-[#3B82F6]
                    "
                >

                    <i
                        class="
                            ti
                            ti-upload
                            text-2xl
                        "
                    ></i>

                </div>


                <!-- TITLE -->

                <p
                    class="
                        mt-4
                        text-sm
                        font-semibold
                        text-gray-700
                        transition-colors
                        duration-150

                        group-hover:text-[#3B82F6]
                    "
                >
                    Browse file to Upload
                </p>


                <!-- FILE NAME -->

                <p
                    id="lead-import-file-name"

                    class="
                        mt-1.5
                        text-xs
                        text-gray-400
                        transition-colors
                        duration-150

                        group-hover:text-blue-500
                    "
                >
                    CSV, XLS or XLSX file
                    ·
                    Maximum 10 MB
                </p>


                <!-- FILE INPUT -->

                <input
                    id="lead-import-file"

                    type="file"

                    name="file"

                    required

                    accept=".csv,.xls,.xlsx"

                    class="hidden"

                    onchange="
                        const file = this.files[0];
                        const label = document.getElementById('lead-import-file-name');

                        if (file) {
                            label.textContent =
                                file.name +
                                ' · ' +
                                (file.size / 1024 / 1024).toFixed(2) +
                                ' MB';
                        } else {
                            label.textContent =
                                'CSV, XLS or XLSX file · Maximum 10 MB';
                        }
                    "
                >

            </label>


            <!-- =================================================
                 NEED A SAMPLE
                 DEFAULT = LOCKED / NEUTRAL
                 HOVER = BLUE
                 ================================================= -->

            <div
                class="
                    group
                    rounded-2xl
                    border
                    border-gray-200
                    bg-white
                    p-4
                    transition-all
                    duration-150

                    hover:border-blue-200
                    hover:bg-blue-50/40
                "
            >

                <div
                    class="
                        flex
                        items-center
                        justify-between
                        gap-4
                    "
                >

                    <!-- LEFT SIDE -->

                    <div
                        class="
                            flex
                            min-w-0
                            items-center
                            gap-3
                        "
                    >

                        <!-- ICON TILE -->

                        <div
                            class="
                                flex
                                h-10
                                w-10
                                shrink-0
                                items-center
                                justify-center
                                rounded-xl
                                bg-gray-50
                                text-gray-500
                                transition-all
                                duration-150

                                group-hover:bg-blue-50
                                group-hover:text-[#3B82F6]
                            "
                        >
                            <i
                                class="
                                    ti
                                    ti-file-spreadsheet
                                    text-lg
                                "
                            ></i>
                        </div>


                        <!-- TEXT -->

                        <div
                            class="
                                min-w-0
                            "
                        >

                            <p
                                class="
                                    text-sm
                                    font-semibold
                                    text-gray-800
                                "
                            >
                                Need a sample?
                            </p>

                            <p
                                class="
                                    mt-0.5
                                    text-xs
                                    text-gray-400
                                "
                            >
                                Use the recommended column format.
                            </p>

                        </div>

                    </div>


                    <!-- DOWNLOAD ACTION TILE -->

                    <a
                        href="{% url 'crm-lead-import-sample' %}"

                        class="
                            inline-flex
                            shrink-0
                            items-center
                            gap-2
                            rounded-xl
                            border
                            border-blue-100
                            bg-blue-50
                            px-3
                            py-2
                            text-sm
                            font-semibold
                            text-[#3B82F6]
                            transition-all
                            duration-150

                            hover:border-blue-200
                            hover:bg-blue-100
                            hover:text-blue-600
                        "
                    >

                        <span
                            class="
                                flex
                                h-7
                                w-7
                                items-center
                                justify-center
                                rounded-lg
                                bg-white
                                text-[#3B82F6]
                                shadow-sm
                            "
                        >
                            <i class="ti ti-download"></i>
                        </span>

                        <span>
                            Download sample file
                        </span>

                    </a>

                </div>

            </div>


            <!-- =================================================
                 FOOTER
                 ================================================= -->

            <div
                class="
                    flex
                    items-center
                    justify-between
                    border-t
                    border-gray-100
                    pt-3
                "
            >

                <!-- BACK -->

                <button
                    type="button"

                    hx-get="{% url 'crm-lead-import-start-modal' %}"

                    hx-target="#modal-root"

                    hx-swap="innerHTML"

                    class="
                        inline-flex
                        items-center
                        gap-2
                        rounded-xl
                        border
                        border-gray-300
                        bg-white
                        px-4
                        py-2.5
                        text-sm
                        font-medium
                        text-gray-700
                        transition-all
                        duration-150

                        hover:border-blue-200
                        hover:bg-blue-50
                        hover:text-[#3B82F6]
                    "
                >

                    <i class="ti ti-arrow-left"></i>

                    Back

                </button>


                <!-- NEXT -->

                <div
                    class="
                        flex
                        items-center
                        gap-3
                    "
                >

                    <span
                        class="
                            text-xs
                            font-medium
                            text-gray-400
                        "
                    >
                        2 of 5
                    </span>


                    <button
                        type="submit"

                        class="
                            inline-flex
                            items-center
                            gap-2
                            rounded-xl
                            bg-[#3B82F6]
                            px-4
                            py-2.5
                            text-sm
                            font-semibold
                            text-white
                            shadow-sm
                            transition-all
                            duration-150

                            hover:bg-blue-600
                            hover:shadow-md
                            hover:shadow-blue-200

                            focus:outline-none
                            focus:ring-4
                            focus:ring-blue-100
                        "
                    >

                        Next

                        <i class="ti ti-arrow-right"></i>

                    </button>

                </div>

            </div>

        </form>

    </div>

</div>
