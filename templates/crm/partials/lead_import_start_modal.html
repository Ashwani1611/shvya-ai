<div
    class="
        fixed
        inset-0
        z-50
        bg-black/40
        flex
        items-center
        justify-center
        p-4
    "
>

    <div
        class="
            bg-white
            rounded-xl
            w-full
            max-w-lg
            shadow-xl
        "
    >

        <!-- HEADER -->

        <div
            class="
                px-5
                py-4
                border-b
                border-gray-200
                flex
                items-center
                justify-between
            "
        >

            <div>

                <h2
                    class="
                        text-lg
                        font-semibold
                        text-gray-900
                    "
                >
                    Import Leads
                </h2>

                <p
                    class="
                        mt-0.5
                        text-xs
                        text-gray-400
                    "
                >
                    How recent are these leads?
                </p>

            </div>

            <button
                type="button"

                onclick="
                    document.getElementById('modal-root').innerHTML=''
                "

                class="
                    w-8
                    h-8
                    rounded-md
                    flex
                    items-center
                    justify-center
                    text-gray-400
                    hover:bg-gray-100
                "
            >
                <i class="ti ti-x text-lg"></i>
            </button>

        </div>


        <!-- CONTENT -->

        <form
            method="post"

            hx-post="{% url 'crm-lead-import-start' %}"

            hx-target="#modal-root"

            hx-swap="none"

            class="
                p-5
                space-y-5
            "
        >

            {% csrf_token %}


            <!-- RECENT -->

            <label
                class="
                    block
                    cursor-pointer
                    border
                    border-gray-200
                    rounded-xl
                    p-4
                    hover:bg-gray-50

                    hover:bg-blue-50
                    hover:text-blue-700
                "
            >

                <div class="flex items-start gap-3">

                    <input
                        type="radio"

                        name="recency"

                        value="recent"

                        checked

                        class="
                            mt-1
                        "
                    >

                    <div>

                        <div
                            class="
                                flex
                                items-center
                                gap-2
                            "
                        >

                            <span
                                class="
                                    text-sm
                                    font-medium
                                    text-gray-800
                                "
                            >
                                Recent Leads
                            </span>

                            <span
                                class="
                                    inline-flex
                                    items-center
                                    rounded-md
                                    bg-blue-50
                                    px-2
                                    py-0.5
                                    text-[10px]
                                    font-medium
                                    text-blue-600
                                "
                            >
                                0–30 days old
                            </span>

                            <span
                                class="
                                    inline-flex
                                    items-center
                                    rounded-md
                                    bg-gray-50
                                    px-2
                                    py-0.5
                                    text-[10px]
                                    font-medium
                                    text-gray-500
                                "
                            >
                                Recommended
                            </span>

                        </div>

                        <p
                            class="
                                mt-1
                                text-xs
                                text-gray-400
                            "
                        >
                            Best choice for safe and effective follow-ups.
                        </p>

                    </div>

                </div>

            </label>


            <!-- OLDER -->

            <label
                class="
                    block
                    cursor-pointer
                    border
                    border-gray-200
                    rounded-xl
                    p-4
                    hover:bg-gray-50

                    hover:bg-blue-50
                    hover:text-blue-700
                "
            >

                <div class="flex items-start gap-3">

                    <input
                        type="radio"

                        name="recency"

                        value="older"

                        class="
                            mt-1
                        "
                    >

                    <div>

                        <div
                            class="
                                text-sm
                                font-medium
                                text-gray-800
                            "
                        >
                            Older Leads
                            <span
                                class="
                                    text-xs
                                    text-gray-400
                                    font-normal
                                "
                            >
                                (More than 30 days old)
                            </span>
                        </div>

                        <p
                            class="
                                mt-1
                                text-xs
                                text-gray-400
                            "
                        >
                            May carry higher risk if contacted without care.
                        </p>

                    </div>

                </div>

            </label>


            <!-- FOOTER -->

            <div
                class="
                    flex
                    items-center
                    justify-between
                    pt-3
                    border-t
                    border-gray-100
                "
            >

                <button
                    type="button"

                    onclick="
                        document.getElementById('modal-root').innerHTML=''
                    "

                    class="
                        inline-flex
                        items-center
                        gap-2
                        rounded-xl
                        border
                        border-gray-300
                        bg-white
                        px-4
                        py-2.5
                        text-sm
                        font-medium
                        text-gray-700
                        transition-all
                        duration-150

                        hover:border-blue-200
                        hover:bg-blue-50
                        hover:text-[#3B82F6]
                    "
                >
                    Cancel
                </button>


                <div
                    class="
                        flex
                        items-center
                        gap-3
                    "
                >

                    <span
                        class="
                            text-xs
                            text-gray-400
                        "
                    >
                        1 of 5
                    </span>

                    <button
                        type="submit"

                        class="
                            inline-flex
                            items-center
                            gap-2
                            px-4
                            py-2
                            rounded-lg
                            bg-blue-500
                            border
                            border-blue-500
                            text-white
                            text-sm
                            font-medium
                            hover:bg-blue-600
                            hover:border-blue-600
                            transition
                        "
                    >
                        Upload
                        <i class="ti ti-arrow-right"></i>
                    </button>

                </div>

            </div>

        </form>

    </div>

</div>
