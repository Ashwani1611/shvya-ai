<div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">

    <div class="bg-white rounded-lg w-full max-w-md max-h-[90vh] overflow-y-auto shadow-xl">

        <!-- Header -->
        <div class="flex items-center justify-between px-5 py-4 border-b">

            <div>
                <h2 class="font-semibold text-lg">
                    Filters
                </h2>

                <p class="text-xs text-gray-400 mt-1">
                    Select a filter and enter its value
                </p>
            </div>

            <button
                type="button"
                onclick="document.getElementById('modal-root').innerHTML='';"
                class="text-gray-400 hover:text-gray-700 text-xl"
            >
                ×
            </button>

        </div>


        <!-- FILTER FORM -->
        <form
            id="lead-filters-form"

            hx-get="{% url 'crm-lead-table-partial' %}"

            hx-target="#lead-table-container"

            hx-swap="innerHTML"

            hx-on::after-request="document.getElementById('modal-root').innerHTML='';"
        >

            <!-- Keep current pipeline -->
            <input
                type="hidden"
                name="pipeline"
                value="{{ pipeline_id }}"
            >


            <div class="px-5 py-4 space-y-4">


                <!-- ========================= -->
                <!-- NAME -->
                <!-- ========================= -->

                <div class="border-b pb-4">

                    <label class="flex items-center gap-2 text-sm font-medium">

                        <input
                            type="checkbox"
                            onchange="toggleFilterInput('name-input', this)"
                        >

                        <span>Name</span>

                    </label>


                    <div
                        id="name-input"
                        class="hidden mt-2 ml-6"
                    >

                        <input
                            type="text"
                            name="filter_name"

                            placeholder="Enter lead name"

                            disabled

                            class="w-full border rounded-md px-3 py-2 text-sm"
                        >

                    </div>

                </div>


                <!-- ========================= -->
                <!-- PHONE -->
                <!-- ========================= -->

                <div class="border-b pb-4">

                    <label class="flex items-center gap-2 text-sm font-medium">

                        <input
                            type="checkbox"
                            onchange="toggleFilterInput('phone-input', this)"
                        >

                        <span>Phone</span>

                    </label>


                    <div
                        id="phone-input"
                        class="hidden mt-2 ml-6"
                    >

                        <input
                            type="text"
                            name="filter_phone"

                            placeholder="Enter phone number"

                            disabled

                            class="w-full border rounded-md px-3 py-2 text-sm"
                        >

                    </div>

                </div>


                <!-- ========================= -->
                <!-- EMAIL -->
                <!-- ========================= -->

                <div class="border-b pb-4">

                    <label class="flex items-center gap-2 text-sm font-medium">

                        <input
                            type="checkbox"
                            onchange="toggleFilterInput('email-input', this)"
                        >

                        <span>Email</span>

                    </label>


                    <div
                        id="email-input"
                        class="hidden mt-2 ml-6"
                    >

                        <input
                            type="text"
                            name="filter_email"

                            placeholder="Enter email address"

                            disabled

                            class="w-full border rounded-md px-3 py-2 text-sm"
                        >

                    </div>

                </div>


                <!-- ========================= -->
                <!-- NOTES -->
                <!-- ========================= -->

                <div class="border-b pb-4">

                    <label class="flex items-center gap-2 text-sm font-medium">

                        <input
                            type="checkbox"
                            onchange="toggleFilterInput('notes-input', this)"
                        >

                        <span>Notes</span>

                    </label>


                    <div
                        id="notes-input"
                        class="hidden mt-2 ml-6"
                    >

                        <textarea
                            name="filter_notes"

                            placeholder="Search notes"

                            rows="3"

                            disabled

                            class="w-full border rounded-md px-3 py-2 text-sm"
                        ></textarea>

                    </div>

                </div>


                <!-- ========================= -->
                <!-- STAGE -->
                <!-- ========================= -->

                <div class="border-b pb-4">

                    <label class="flex items-center gap-2 text-sm font-medium">

                        <input
                            type="checkbox"
                            onchange="toggleFilterInput('stage-input', this)"
                        >

                        <span>Stage</span>

                    </label>


                    <div
                        id="stage-input"
                        class="hidden mt-2 ml-6"
                    >

                        <select
                            name="filter_stage"

                            disabled

                            class="w-full border rounded-md px-3 py-2 text-sm"
                        >

                            <option value="">
                                Select stage
                            </option>

                            {% for stage in stages %}

                            <option value="{{ stage.id }}">
                                {{ stage.name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>


                <!-- ========================= -->
                <!-- PIPELINE -->
                <!-- ========================= -->

                <div class="border-b pb-4">

                    <label class="flex items-center gap-2 text-sm font-medium">

                        <input
                            type="checkbox"
                            onchange="toggleFilterInput('pipeline-input', this)"
                        >

                        <span>Pipeline</span>

                    </label>


                    <div
                        id="pipeline-input"
                        class="hidden mt-2 ml-6"
                    >

                        <select
                            name="filter_pipeline"

                            disabled

                            class="w-full border rounded-md px-3 py-2 text-sm"
                        >

                            <option value="">
                                Select pipeline
                            </option>

                            {% for pipeline in pipelines %}

                            <option value="{{ pipeline.id }}">
                                {{ pipeline.name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>


                <!-- ========================= -->
                <!-- ATTRIBUTES -->
                <!-- ========================= -->

                {% if attribute_fields %}

                <div>

                    <div class="text-xs text-gray-400 font-medium mb-2">
                        Attributes
                    </div>


                    {% for field in attribute_fields %}

                    <div class="border-b pb-4 mb-4">

                        <label class="flex items-center gap-2 text-sm font-medium">

                            <input
                                type="checkbox"
                                onchange="toggleFilterInput('attribute-{{ forloop.counter }}', this)"
                            >

                            <span>{{ field }}</span>

                        </label>


                        <div
                            id="attribute-{{ forloop.counter }}"
                            class="hidden mt-2 ml-6"
                        >

                            <input
                                type="text"

                                name="attr_{{ field }}"

                                placeholder="Enter {{ field }}"

                                disabled

                                class="w-full border rounded-md px-3 py-2 text-sm"
                            >

                        </div>

                    </div>

                    {% endfor %}

                </div>

                {% endif %}


                <!-- ========================= -->
                <!-- DATES -->
                <!-- ========================= -->

                <div>

                    <div class="text-xs text-gray-400 font-medium mb-2">
                        Dates
                    </div>


                    <!-- CREATED DATE -->

                    <div class="border-b pb-4 mb-4">

                        <label class="flex items-center gap-2 text-sm font-medium">

                            <input
                                type="checkbox"
                                onchange="toggleFilterInput('created-date-input', this)"
                            >

                            <span>Created Date</span>

                        </label>


                        <div
                            id="created-date-input"
                            class="hidden mt-2 ml-6 space-y-2"
                        >

                            <div>

                                <label class="block text-xs text-gray-500 mb-1">
                                    From
                                </label>

                                <input
                                    type="date"

                                    name="filter_created_after"

                                    disabled

                                    class="w-full border rounded-md px-3 py-2 text-sm"
                                >

                            </div>


                            <div>

                                <label class="block text-xs text-gray-500 mb-1">
                                    To
                                </label>

                                <input
                                    type="date"

                                    name="filter_created_before"

                                    disabled

                                    class="w-full border rounded-md px-3 py-2 text-sm"
                                >

                            </div>

                        </div>

                    </div>


                    <!-- REMINDER DATE -->

                    <div class="border-b pb-4 mb-4">

                        <label class="flex items-center gap-2 text-sm font-medium">

                            <input
                                type="checkbox"
                                onchange="toggleFilterInput('reminder-date-input', this)"
                            >

                            <span>Reminder Date</span>

                        </label>


                        <div
                            id="reminder-date-input"
                            class="hidden mt-2 ml-6"
                        >

                            <input
                                type="date"

                                name="filter_reminder_date"

                                disabled

                                class="w-full border rounded-md px-3 py-2 text-sm"
                            >

                        </div>

                    </div>


                    <!-- STAGE UPDATED DATE -->

                    <div class="border-b pb-4 mb-4">

                        <label class="flex items-center gap-2 text-sm font-medium">

                            <input
                                type="checkbox"
                                onchange="toggleFilterInput('stage-updated-date-input', this)"
                            >

                            <span>Stage Updated Date</span>

                        </label>


                        <div
                            id="stage-updated-date-input"
                            class="hidden mt-2 ml-6"
                        >

                            <input
                                type="date"

                                name="filter_stage_updated_date"

                                disabled

                                class="w-full border rounded-md px-3 py-2 text-sm"
                            >

                        </div>

                    </div>


                    <!-- PIPELINE UPDATED DATE -->

                    <div class="border-b pb-4 mb-4">

                        <label class="flex items-center gap-2 text-sm font-medium">

                            <input
                                type="checkbox"
                                onchange="toggleFilterInput('pipeline-updated-date-input', this)"
                            >

                            <span>Pipeline Updated Date</span>

                        </label>


                        <div
                            id="pipeline-updated-date-input"
                            class="hidden mt-2 ml-6"
                        >

                            <input
                                type="date"

                                name="filter_pipeline_updated_date"

                                disabled

                                class="w-full border rounded-md px-3 py-2 text-sm"
                            >

                        </div>

                    </div>


                    <!-- AI QUALIFIED DATE -->

                    <div class="border-b pb-4 mb-4">

                        <label class="flex items-center gap-2 text-sm font-medium">

                            <input
                                type="checkbox"
                                onchange="toggleFilterInput('ai-qualified-date-input', this)"
                            >

                            <span>AI Qualified Date</span>

                        </label>


                        <div
                            id="ai-qualified-date-input"
                            class="hidden mt-2 ml-6"
                        >

                            <input
                                type="date"

                                name="filter_ai_qualified_date"

                                disabled

                                class="w-full border rounded-md px-3 py-2 text-sm"
                            >

                        </div>

                    </div>


                    <!-- DAYS IN STAGE -->

                    <div>

                        <label class="flex items-center gap-2 text-sm font-medium">

                            <input
                                type="checkbox"
                                onchange="toggleFilterInput('days-in-stage-input', this)"
                            >

                            <span>Days in stage</span>

                        </label>


                        <div
                            id="days-in-stage-input"
                            class="hidden mt-2 ml-6"
                        >

                            <input
                                type="number"

                                name="filter_days_in_stage"

                                min="0"

                                placeholder="Enter number of days"

                                disabled

                                class="w-full border rounded-md px-3 py-2 text-sm"
                            >

                        </div>

                    </div>

                </div>

            </div>


            <!-- Footer -->

            <div class="flex justify-between px-5 py-4 border-t bg-white sticky bottom-0">

                <button
                    type="button"

                    onclick="document.getElementById('modal-root').innerHTML='';"

                    class="px-4 py-2 border rounded-md text-sm"
                >
                    Back
                </button>


                <button
                    type="submit"

                    class="px-5 py-2 bg-blue-600 text-white rounded-md text-sm hover:bg-blue-700"
                >
                    Apply Filters
                </button>

            </div>

        </form>

    </div>

</div>


<script>

function toggleFilterInput(inputId, checkbox) {

    const container = document.getElementById(inputId);

    if (!container) {
        return;
    }


    const fields = container.querySelectorAll(
        "input, textarea, select"
    );


    if (checkbox.checked) {

        container.classList.remove("hidden");

        fields.forEach(function(field) {

            field.disabled = false;

        });

    } else {

        container.classList.add("hidden");

        fields.forEach(function(field) {

            field.disabled = true;

            field.value = "";

        });

    }

}

</script>
