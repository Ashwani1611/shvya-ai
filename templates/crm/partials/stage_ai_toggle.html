<form
    method="post"
    hx-post="{% url 'crm-stage-ai-toggle' stage.id %}"
    hx-target="this"
    hx-swap="outerHTML"
    class="shrink-0"
>
    {% csrf_token %}
    <button
        type="submit"
        role="switch"
        aria-checked="{% if stage.ai_on %}true{% else %}false{% endif %}"
        aria-label="Turn AI {% if stage.ai_on %}off{% else %}on{% endif %} for {{ stage.name }}"
        title="Stage AI is {% if stage.ai_on %}on{% else %}off{% endif %}"
        class="inline-flex h-9 items-center gap-1.5 rounded-full px-2.5 text-xs font-semibold transition {% if stage.ai_on %}bg-emerald-100 text-emerald-700 hover:bg-emerald-200{% else %}bg-gray-100 text-gray-600 hover:bg-gray-200{% endif %}"
    >
        <i class="ti ti-sparkles"></i>
        AI {% if stage.ai_on %}On{% else %}Off{% endif %}
    </button>
</form>

{% if stage.is_system_locked %}
<span
    class="inline-flex h-9 shrink-0 items-center gap-1 rounded-full bg-slate-100 px-2.5 text-xs font-semibold text-slate-600"
    title="{{ stage.name }} is a required SHVYA system stage. Its name cannot be changed or deleted."
    aria-label="{{ stage.name }} is locked"
>
    <i class="ti ti-lock"></i>
    Locked
</span>
<script>
(function () {
    const script = document.currentScript;
    const row = script && script.parentElement;
    if (!row) return;

    const nameInput = row.querySelector('input[name="name"]');
    if (nameInput) {
        nameInput.readOnly = true;
        nameInput.setAttribute('aria-readonly', 'true');
        nameInput.title = '{{ stage.name|escapejs }} is a required SHVYA system stage and cannot be renamed.';
        nameInput.classList.add('bg-slate-50', 'text-slate-500', 'cursor-not-allowed');
    }

    const renameButton = row.querySelector('button[title="Save stage name"]');
    if (renameButton) {
        renameButton.disabled = true;
        renameButton.hidden = true;
    }

    const deleteButton = row.querySelector('button[title="Delete stage"]');
    if (deleteButton) {
        deleteButton.disabled = true;
        deleteButton.hidden = true;
    }
})();
</script>
{% endif %}
