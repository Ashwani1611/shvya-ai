<div class="rounded-xl border border-gray-200 bg-white p-3 shadow-sm">
    <div class="flex items-start gap-3">
        <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-gray-50 text-gray-500"><i class="ti ti-clock"></i></div>
        <div class="min-w-0 flex-1">
            <div class="flex items-start justify-between gap-3">
                <div class="min-w-0">
                    <p class="truncate text-sm font-semibold text-gray-900">{{ reminder.title }}</p>
                    <p class="mt-0.5 truncate text-xs text-gray-500">{{ reminder.lead.name }} · {{ reminder.lead.pipeline.name }} · {{ reminder.lead.stage.name }}</p>
                </div>
                <span class="shrink-0 text-[11px] font-medium text-gray-500">{{ reminder.due_at|date:"d M, h:i A" }}</span>
            </div>
            {% if reminder.description %}<p class="mt-2 text-xs leading-relaxed text-gray-500">{{ reminder.description }}</p>{% endif %}
            <div class="mt-3 flex flex-wrap items-center gap-2">
                <a href="{% url 'crm-dashboard' %}?pipeline={{ reminder.lead.pipeline_id }}&lead={{ reminder.lead_id }}" class="inline-flex items-center gap-1 rounded-lg border border-gray-200 px-2.5 py-1.5 text-xs font-medium text-gray-600 hover:bg-gray-50"><i class="ti ti-user"></i> Open lead</a>
                <form
                    hx-post="{% url 'crm-global-reminder-snooze' reminder.id %}"
                    hx-swap="none"
                    hx-on::after-request="htmx.ajax('GET','{% url 'crm-global-reminders-modal' %}{% if filters_query %}?{{ filters_query }}{% endif %}',{target:'#modal-root',swap:'innerHTML'})"
                >{% csrf_token %}<button class="inline-flex items-center gap-1 rounded-lg border border-gray-200 px-2.5 py-1.5 text-xs font-medium text-gray-600 hover:bg-gray-50" type="submit"><i class="ti ti-clock-plus"></i> Snooze 30m</button></form>
                <form
                    hx-post="{% url 'crm-global-reminder-complete' reminder.id %}"
                    hx-swap="none"
                    hx-on::after-request="htmx.ajax('GET','{% url 'crm-global-reminders-modal' %}{% if filters_query %}?{{ filters_query }}{% endif %}',{target:'#modal-root',swap:'innerHTML'})"
                >{% csrf_token %}<button class="inline-flex items-center gap-1 rounded-lg bg-blue-600 px-2.5 py-1.5 text-xs font-semibold text-white hover:bg-blue-700" type="submit"><i class="ti ti-check"></i> Complete</button></form>
                <form
                    hx-post="{% url 'crm-global-reminder-delete' reminder.id %}"
                    hx-swap="none"
                    hx-confirm="Delete this reminder?"
                    hx-on::after-request="htmx.ajax('GET','{% url 'crm-global-reminders-modal' %}{% if filters_query %}?{{ filters_query }}{% endif %}',{target:'#modal-root',swap:'innerHTML'})"
                >{% csrf_token %}<button class="inline-flex items-center gap-1 rounded-lg px-2 py-1.5 text-xs font-medium text-red-500 hover:bg-red-50" type="submit"><i class="ti ti-trash"></i></button></form>
            </div>
        </div>
    </div>
</div>
