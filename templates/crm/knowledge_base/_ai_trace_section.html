<section class="overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm">
  <div class="flex items-center gap-3 border-b border-gray-100 px-5 py-4">
    <span class="flex h-7 w-7 items-center justify-center rounded-full bg-gray-100 text-xs font-semibold text-gray-600">{{ number }}</span>
    <h3 class="text-sm font-semibold text-gray-900">{{ title }}</h3>
  </div>
  <div class="p-5">
    <pre class="whitespace-pre-wrap break-words rounded-xl bg-gray-50 p-4 text-xs leading-6 text-gray-700">{{ value|default:'Not available' }}</pre>
  </div>
</section>
