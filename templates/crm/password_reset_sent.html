<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Password Reset - SHVYA AI</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="min-h-screen bg-white flex items-center justify-center">

    <div class="w-full max-w-md px-6">

        <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-8 text-center">

            <div class="text-4xl mb-4">
                ✓
            </div>

            <h1 class="text-2xl font-bold text-gray-900">
                Check Your Email
            </h1>

            <p class="mt-3 text-sm text-gray-600">
                If an account exists with that email address,
                we have sent instructions to reset your password.
            </p>

            <a
                href="{% url 'crm-login' %}"
                class="inline-block mt-6 text-blue-600 hover:underline text-sm font-medium"
            >
                Back to Login
            </a>

        </div>

    </div>

</body>

</html>
