{% extends "base.html" %}

{% block title %}
    SHVYA AI - CRM
{% endblock %}


{% block content %}

<div class="h-full flex flex-col">


    <!-- ======================================================
         TOOLBAR
         ====================================================== -->

    <div
        class="bg-white
               border border-gray-200
               rounded-xl
               p-3
               mb-4"
    >

        <div class="flex items-center gap-3">


            <!-- ==================================================
                 PIPELINE
                 ================================================== -->

            <div class="relative">

                <select
                    id="pipeline-select"
                    name="pipeline"

                    class="appearance-none
                           min-w-[180px]
                           border border-gray-300
                           rounded-lg
                           bg-white
                           px-3 pr-9 py-2
                           text-sm text-gray-700
                           focus:outline-none
                           focus:ring-2
                           focus:ring-blue-100
                           focus:border-blue-500"

                    hx-get="{% url 'crm-lead-table-partial' %}"

                    hx-target="#lead-table-container"

                    hx-trigger="change"

                    hx-include="#search-input"
                >

                    {% for p in pipelines %}

                    <option
                        value="{{ p.id }}"
                        {% if p.id|stringformat:"s" == selected_pipeline_id %}
                            selected
                        {% endif %}
                    >
                        {{ p.name }}
                    </option>

                    {% endfor %}

                </select>


                <i
                    class="ti ti-chevron-down
                           absolute
                           right-3
                           top-1/2
                           -translate-y-1/2
                           text-gray-400
                           pointer-events-none"
                ></i>

            </div>



            <!-- ==================================================
                 SEARCH
                 ================================================== -->

            <div class="relative flex-1 max-w-xl">

                <i
                    class="ti ti-search
                           absolute
                           left-3
                           top-1/2
                           -translate-y-1/2
                           text-gray-400"
                ></i>


                <input
                    id="search-input"

                    type="text"

                    name="search"

                    placeholder="Search leads by name, phone or email"

                    class="w-full
                           border border-gray-300
                           rounded-lg
                           bg-white
                           pl-9 pr-3 py-2
                           text-sm text-gray-700
                           placeholder-gray-400
                           focus:outline-none
                           focus:ring-2
                           focus:ring-blue-100
                           focus:border-blue-500"

                    hx-get="{% url 'crm-lead-table-partial' %}"

                    hx-target="#lead-table-container"

                    hx-trigger="keyup changed delay:400ms"

                    hx-include="#pipeline-select"
                />

            </div>



            <!-- ==================================================
                 FILTERS
                 ================================================== -->

            <button
                type="button"

                class="inline-flex
                       items-center
                       justify-center
                       gap-2
                       px-3
                       py-2
                       border border-gray-300
                       rounded-lg
                       bg-white
                       text-sm
                       font-medium
                       text-gray-700
                       transition-all
                       duration-150

                       hover:bg-blue-50
                       hover:border-blue-100
                       hover:text-[#3B82F6]

                       focus:outline-none
                       focus:ring-4
                       focus:ring-blue-100
                "       

                hx-get="{% url 'crm-lead-filters-modal' %}?pipeline={{ selected_pipeline_id }}"

                hx-target="#modal-root"

                hx-swap="innerHTML"

                title="Filters"
            >

                <i class="ti ti-adjustments-horizontal"></i>

                <span>
                    Filters
                </span>

            </button>

        </div>

    </div>



    <!-- ======================================================
         LEAD TABLE / PIPELINE
         ====================================================== -->

    <div
        id="lead-table-container"

        class="flex-1 min-h-0"

        hx-get="{% url 'crm-lead-table-partial' %}?pipeline={{ selected_pipeline_id }}"

        hx-trigger="load"

        hx-swap="innerHTML"
    >

        <div
            class="flex items-center justify-center
                   py-16
                   text-sm text-gray-400"
        >

            <div class="flex items-center gap-2">

                <i class="ti ti-loader-2 animate-spin"></i>

                <span>
                    Loading leads...
                </span>

            </div>

        </div>

    </div>


</div>


{% endblock %}
