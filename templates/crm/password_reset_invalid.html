<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Invalid Reset Link - SHVYA AI</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="min-h-screen bg-white flex items-center justify-center">

    <div class="w-full max-w-md px-6">

        <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-8 text-center">

            <h1 class="text-2xl font-bold text-gray-900">
                Reset Link Invalid
            </h1>

            <p class="mt-3 text-sm text-gray-600">
                This password reset link is invalid or has expired.
                Please request a new password reset link.
            </p>

            <a
                href="{% url 'crm-forgot-password' %}"
                class="inline-block mt-6 bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-md text-sm font-semibold"
            >
                Request New Link
            </a>

        </div>

    </div>

</body>

</html>
