<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - SHVYA AI</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="min-h-screen bg-white flex items-center justify-center">

    <div class="w-full max-w-md px-6">

        <div class="text-center mb-8">

            <h1 class="text-2xl font-bold text-gray-900">
                Forgot Password?
            </h1>

            <p class="mt-2 text-sm text-gray-500">
                Enter your email address and we'll send you a
                password reset link.
            </p>

        </div>

        <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-6">

            <form
                method="POST"
                action="{% url 'crm-forgot-password' %}"
            >

                {% csrf_token %}

                <div>

                    <label
                        for="email"
                        class="block text-sm font-semibold text-gray-700 mb-2"
                    >
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        autocomplete="email"
                        placeholder="Enter your email"
                        class="w-full border border-gray-300 rounded-md px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >

                </div>

                <button
                    type="submit"
                    class="mt-5 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-md transition"
                >
                    Send Reset Link
                </button>

            </form>

            <div class="mt-5 text-center">

                <a
                    href="{% url 'crm-login' %}"
                    class="text-sm text-blue-600 hover:underline"
                >
                    Back to Login
                </a>

            </div>

        </div>

    </div>

</body>

</html>
