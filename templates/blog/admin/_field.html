<div class="blog-field{% if field.errors %} has-error{% endif %}">
    {{ field.label_tag }}
    {{ field }}
    {% if help %}<p class="blog-help">{{ help }}</p>{% elif field.help_text %}<p class="blog-help">{{ field.help_text }}</p>{% endif %}
    {% for error in field.errors %}<p class="blog-field-error">{{ error }}</p>{% endfor %}
</div>
