{% extends "base_legacy.html" %}
{% load static %}

{% block extra_head %}
{{ block.super }}
<link rel="icon" type="image/svg+xml" href="{% static 'images/shvya-logo.svg' %}">
<link rel="shortcut icon" href="{% static 'images/shvya-logo.svg' %}">

<script>
(function () {
    document.documentElement.classList.add('shvya-shell-enhancing');
    try {
        if (window.localStorage.getItem('shvya-sidebar-collapsed') === '1') {
            document.documentElement.classList.add('shvya-sidebar-pref-collapsed');
        }
    } catch (error) {
        // Storage restrictions must never block the dashboard shell.
    }

    // Fail open to the legacy sidebar if enhancement JS cannot initialize.
    window.setTimeout(function () {
        document.documentElement.classList.remove('shvya-shell-enhancing');
    }, 1800);
})();
</script>

<link rel="stylesheet" href="{% static 'css/shvya_premium_sidebar.css' %}">
<meta name="shvya-logo-url" content="{% static 'images/shvya-logo.svg' %}">
<meta name="shvya-profile-url" content="{{ sidebar_profile_href|default:'' }}">
<meta name="shvya-user-name" content="{{ request.crm_user.name|default:'Account' }}">
{{ sidebar_nav_sections|json_script:"shvya-sidebar-sections" }}
{{ sidebar_utility_items|json_script:"shvya-sidebar-utilities" }}
<script src="{% static 'js/shvya_premium_sidebar.js' %}" defer></script>

<script src="{% static 'js/ai_setup_knowledge_delete.js' %}" defer></script>
<script src="{% static 'js/ai_setup_playground.js' %}" defer></script>
{% include "base/base.html" %}
{% endblock %}
