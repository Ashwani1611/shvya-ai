{% if meeting_link %}
<div class="mt-2 flex flex-wrap items-center gap-2" data-meeting-link-controls>
  <button type="button" class="rounded border border-blue-300 px-2 py-1 text-sm text-blue-600" data-copy-meeting-link="{{ meeting_link }}"><i class="ti ti-copy" aria-hidden="true"></i> <span>Copy Meet link</span></button>
  <a class="text-sm text-blue-600 underline" href="{{ meeting_link }}" target="_blank" rel="noopener noreferrer">Join meeting</a>
  <span class="text-xs" data-meeting-copy-status role="status" aria-live="polite"></span>
</div>
{% endif %}
