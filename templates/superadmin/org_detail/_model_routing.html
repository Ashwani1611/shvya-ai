<section id="ai-model-routing" class="bg-white rounded-xl border border-slate-200 p-6 my-6">
    <h2 class="text-lg font-semibold">Advanced model routing</h2>
    <p class="text-sm text-slate-600 mt-2">Models for {{ organization.name }}. Only superadmin can change these settings. Leave blank to use platform defaults.</p>
    <form method="post" action="{% url 'superadmin-organization-model-routing-update' organization.id %}" class="grid gap-4 mt-4">
        {% csrf_token %}
        <div><label for="qualification-model">Qualification model (New Lead)</label><input id="qualification-model" name="qualification_model" maxlength="100" value="{{ model_routing_info.qualification_model|default:'' }}" placeholder="Platform default" class="block w-full border rounded-lg p-2"></div>
        <div><label for="sales-support-model">Sales-support model (other active stages)</label><input id="sales-support-model" name="sales_support_model" maxlength="100" value="{{ model_routing_info.sales_support_model|default:'' }}" placeholder="Platform default" class="block w-full border rounded-lg p-2"></div>
        <div><label for="summary-model">Post-turn summary model</label><input id="summary-model" name="summary_model" maxlength="100" value="{{ model_routing_info.summary_model|default:'' }}" placeholder="Platform default" class="block w-full border rounded-lg p-2"></div>
        <p class="text-sm text-slate-600">Use model IDs available to the platform's provider account. Unavailable overrides fall back to platform defaults.</p>
        <button type="submit" class="rounded-lg bg-slate-900 text-white px-4 py-2 justify-self-start">Save model routing</button>
    </form>
</section>
