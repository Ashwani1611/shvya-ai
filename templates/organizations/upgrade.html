{% extends "base.html" %}
{% block content %}
<section class="max-w-xl mx-auto mt-20 p-10 bg-white border rounded-3xl text-center">
  <i class="ti ti-lock text-4xl text-indigo-600" aria-hidden="true"></i>
  <h1 class="text-3xl font-semibold mt-5">Upgrade to unlock</h1>
  <p class="text-gray-600 mt-4">{{ module_label }} is not included in your organisation’s current package. Contact your administrator to upgrade or request access.</p>
  <a href="{% url 'pricing' %}" class="inline-block mt-6 px-6 py-3 rounded-xl bg-indigo-600 text-white">View plans</a>
</section>
{% endblock %}
