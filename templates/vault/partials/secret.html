{% if fresh_secret %}
<section class="vault-secret vault-card" role="status">
  <div><p class="vault-eyebrow">SAVE THIS NOW</p><h2>{{ fresh_secret.label|default:'New access credential' }}</h2><p>{{ fresh_secret.help|default:'This value is shown only once. Copy it now and share it only with the intended recipient.' }}</p></div>
  <div class="vault-secret-value"><code>{{ fresh_secret.value }}</code><button type="button" class="vault-button vault-button-small" data-copy="{{ fresh_secret.value }}" data-copy-label="Credential copied">Copy</button></div>
</section>
{% endif %}
