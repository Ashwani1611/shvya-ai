[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["apps", "tests"]
addopts = "--reuse-db"

[tool.coverage.run]
source = ["apps", "core", "services"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"apps/*/views/__init__.py" = ["F403"]
"apps/triggers/models/__init__.py" = ["F403"]
"config/settings/*.py" = ["F403", "F405"]
