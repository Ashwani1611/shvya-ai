services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-5}
      MAX_DB_CONNECTIONS: ${PGBOUNCER_MAX_DB_CONNECTIONS:-30}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "6379"

  web:
    build: .
    image: shvya-staging-app:latest
    restart: unless-stopped
    deploy:
      replicas: ${WEB_REPLICAS:-1}
    scale: ${WEB_REPLICAS:-1}
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      DJANGO_SETTINGS_MODULE: config.settings.staging
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_USE_PGBOUNCER: "True"
      DB_CONN_MAX_AGE: "0"
      REDIS_URL: redis://redis:6379/0
      CHANNEL_LAYER_REDIS_URL: redis://redis:6379/1
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - ${GUNICORN_WORKERS:-2}
      # Staging shares the same CPU-contended host as production. Allow the
      # Django URL graph and app registry to finish loading instead of letting
      # Gunicorn's 30-second default kill healthy workers during deploy.
      - --timeout
      - ${GUNICORN_TIMEOUT:-120}
      - --graceful-timeout
      - ${GUNICORN_GRACEFUL_TIMEOUT:-60}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import http.client; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=3); c.request('GET','/health/ready/',headers={'Host':'staging.shvya-ai.com','X-Forwarded-Proto':'https'}); r=c.getresponse(); raise SystemExit(0 if r.status == 200 else 1)\"",
        ]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 120s
    expose:
      - "8000"

  ws:
    build: .
    image: shvya-staging-app:latest
    restart: unless-stopped
    deploy:
      replicas: ${ASGI_REPLICAS:-1}
    scale: ${ASGI_REPLICAS:-1}
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      DJANGO_SETTINGS_MODULE: config.settings.staging
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_USE_PGBOUNCER: "True"
      DB_CONN_MAX_AGE: "0"
      REDIS_URL: redis://redis:6379/0
      CHANNEL_LAYER_REDIS_URL: redis://redis:6379/1
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - daphne
      - -b
      - "0.0.0.0"
      - -p
      - "8001"
      - config.asgi:application
    expose:
      - "8001"

  worker:
    build: .
    image: shvya-staging-app:latest
    restart: unless-stopped
    deploy:
      replicas: ${CELERY_GENERAL_REPLICAS:-1}
    scale: ${CELERY_GENERAL_REPLICAS:-1}
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      DJANGO_SETTINGS_MODULE: config.settings.staging
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_USE_PGBOUNCER: "True"
      DB_CONN_MAX_AGE: "0"
      REDIS_URL: redis://redis:6379/0
      CHANNEL_LAYER_REDIS_URL: redis://redis:6379/1
    volumes:
      - media_volume:/app/media
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "celery", "--concurrency=${CELERY_GENERAL_CONCURRENCY:-2}", "--prefetch-multiplier=1"]

  ai_realtime_worker:
    build: .
    image: shvya-staging-app:latest
    restart: unless-stopped
    deploy:
      replicas: ${CELERY_AI_REALTIME_REPLICAS:-1}
    scale: ${CELERY_AI_REALTIME_REPLICAS:-1}
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      DJANGO_SETTINGS_MODULE: config.settings.staging
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_USE_PGBOUNCER: "True"
      DB_CONN_MAX_AGE: "0"
      REDIS_URL: redis://redis:6379/0
      CHANNEL_LAYER_REDIS_URL: redis://redis:6379/1
    volumes:
      - media_volume:/app/media
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - celery
      - -A
      - config
      - worker
      - -l
      - info
      - -Q
      - ai_realtime
      - --concurrency=${CELERY_AI_REALTIME_CONCURRENCY:-1}
      - --prefetch-multiplier=1

  hosted_ai_worker:
    build: .
    image: shvya-staging-app:latest
    restart: unless-stopped
    deploy:
      replicas: ${CELERY_HOSTED_AI_REPLICAS:-1}
    scale: ${CELERY_HOSTED_AI_REPLICAS:-1}
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      DJANGO_SETTINGS_MODULE: config.settings.staging
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_USE_PGBOUNCER: "True"
      DB_CONN_MAX_AGE: "0"
      REDIS_URL: redis://redis:6379/0
      CHANNEL_LAYER_REDIS_URL: redis://redis:6379/1
    volumes:
      - media_volume:/app/media
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - celery
      - -A
      - config
      - worker
      - -l
      - info
      - -Q
      - hosted_ai
      - --concurrency=${CELERY_HOSTED_AI_CONCURRENCY:-1}
      - --prefetch-multiplier=1

  campaign_worker:
    build: .
    image: shvya-staging-app:latest
    restart: unless-stopped
    deploy:
      replicas: ${CELERY_CAMPAIGN_REPLICAS:-1}
    scale: ${CELERY_CAMPAIGN_REPLICAS:-1}
    env_file: [.env.staging]
    environment:
      APP_ENV: staging
      DJANGO_SETTINGS_MODULE: config.settings.staging
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_USE_PGBOUNCER: "True"
      DB_CONN_MAX_AGE: "0"
      REDIS_URL: redis://redis:6379/0
      CHANNEL_LAYER_REDIS_URL: redis://redis:6379/1
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "campaigns", "--concurrency=${CELERY_CAMPAIGN_CONCURRENCY:-1}", "--prefetch-multiplier=1"]

  ingestion_worker:
    build: .
    image: shvya-staging-app:latest
    restart: unless-stopped
    deploy:
      replicas: ${CELERY_INGESTION_REPLICAS:-1}
    scale: ${CELERY_INGESTION_REPLICAS:-1}
    env_file: [.env.staging]
    environment:
      APP_ENV: staging
      DJANGO_SETTINGS_MODULE: config.settings.staging
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_USE_PGBOUNCER: "True"
      DB_CONN_MAX_AGE: "0"
      REDIS_URL: redis://redis:6379/0
      CHANNEL_LAYER_REDIS_URL: redis://redis:6379/1
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "ingestion", "--concurrency=${CELERY_INGESTION_CONCURRENCY:-1}", "--prefetch-multiplier=1"]

  automation_worker:
    build: .
    image: shvya-staging-app:latest
    restart: unless-stopped
    deploy:
      replicas: ${CELERY_AUTOMATION_REPLICAS:-1}
    scale: ${CELERY_AUTOMATION_REPLICAS:-1}
    env_file: [.env.staging]
    environment:
      APP_ENV: staging
      DJANGO_SETTINGS_MODULE: config.settings.staging
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_USE_PGBOUNCER: "True"
      DB_CONN_MAX_AGE: "0"
      REDIS_URL: redis://redis:6379/0
      CHANNEL_LAYER_REDIS_URL: redis://redis:6379/1
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "automation", "--concurrency=${CELERY_AUTOMATION_CONCURRENCY:-1}", "--prefetch-multiplier=1"]

  beat:
    build: .
    image: shvya-staging-app:latest
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      DJANGO_SETTINGS_MODULE: config.settings.staging
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_USE_PGBOUNCER: "True"
      DB_CONN_MAX_AGE: "0"
      REDIS_URL: redis://redis:6379/0
      CHANNEL_LAYER_REDIS_URL: redis://redis:6379/1
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "config", "beat", "-l", "info"]

  whatsapp-web-gateway:
    build:
      context: ./whatsapp_web_gateway
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      REDIS_URL: redis://redis:6379/4
      WHATSAPP_WEB_GATEWAY_SHARD: ${WHATSAPP_WEB_GATEWAY_SHARD:-primary}
      WHATSAPP_WEB_GATEWAY_INSTANCE_ID: ${WHATSAPP_WEB_GATEWAY_INSTANCE_ID:-}
      WHATSAPP_WEB_MAX_SESSIONS: ${WHATSAPP_WEB_MAX_SESSIONS:-25}
      WHATSAPP_WEB_SESSION_PATH: /data/wwebjs_auth
      SHVYA_HOSTED_CALLBACK_URL: http://web:8000/dashboard/whatsapp/connect/hosted/events/
    volumes:
      - whatsapp_sessions:/data/wwebjs_auth
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: shvya-staging-nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      ws:
        condition: service_started
    volumes:
      - ./nginx/staging/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.staging.htpasswd:/etc/nginx/staging.htpasswd:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    ports:
      - "127.0.0.1:8180:80"
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health/live/"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s

volumes:
  postgres_data:
  static_volume:
    driver: local
    driver_opts:
      type: none
      device: /opt/shvya-ai-staging/staticfiles
      o: bind
  media_volume:
    driver: local
    driver_opts:
      type: none
      device: /opt/shvya-ai-staging/media
      o: bind
  whatsapp_sessions:
